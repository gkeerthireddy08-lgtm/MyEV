<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyEV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width app column (map/list, stay-or-switch, trip, assistant, me) with a bottom tab bar. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface-2:#E2E9E6; --ink:#12201C; --muted:#56685F; --line:#C9D4CF;
  --accent:#0A6B5C; --accent-ink:#FFFFFF; --accent-soft:#D3EAE4;
  --ok:#1B7A3D; --ok-soft:#DDF0E3; --warn:#9A5800; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#F9DEDB; --info:#2C5BA3; --info-soft:#DDE7F6;
  --map-land:#E1E8E3; --map-road:#FFFFFF; --map-ring:#F2D9A8; --map-water:#B9D4DE; --map-text:#6B7C76;
  --f-indic:"Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Bengali";
  --f-display:"Archivo",var(--f-indic),"Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",var(--f-indic),system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:9px;
  --logo-ground:#0D1A3D; --logo-ink:#E8EEFF;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#15201C; --surface-2:#1D2A26; --ink:#E5EEEA; --muted:#92A59E; --line:#2A3A35;
  --accent:#44C4A8; --accent-ink:#04201A; --accent-soft:#16352E;
  --ok:#55C77F; --ok-soft:#173222; --warn:#F2A845; --warn-soft:#3A2A12; --bad:#FF8173; --bad-soft:#3D1A17; --info:#86AEF2; --info-soft:#1B2840;
  --map-land:#18231F; --map-road:#2A3833; --map-ring:#4A3D22; --map-water:#1C3943; --map-text:#7F938C;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#15201C; --surface-2:#1D2A26; --ink:#E5EEEA; --muted:#92A59E; --line:#2A3A35;
  --accent:#44C4A8; --accent-ink:#04201A; --accent-soft:#16352E;
  --ok:#55C77F; --ok-soft:#173222; --warn:#F2A845; --warn-soft:#3A2A12; --bad:#FF8173; --bad-soft:#3D1A17; --info:#86AEF2; --info-soft:#1B2840;
  --map-land:#18231F; --map-road:#2A3833; --map-ring:#4A3D22; --map-water:#1C3943; --map-text:#7F938C;
  color-scheme:dark; }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.shell{display:flex;justify-content:center;min-height:100dvh}
.app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:768px){ .app{max-width:760px;border-inline:1px solid var(--line)} main{padding-inline:24px!important} }
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{flex:1;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.01em;overflow-wrap:anywhere}
h1{font-size:26px;font-weight:800}
h2{font-size:20px;font-weight:750}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.eyebrow{overflow-wrap:anywhere;font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.brandcol{display:flex;align-items:center;gap:10px}
.batt{min-width:0}
.batt{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;min-height:44px}
.batt-cell{flex:none;width:30px;height:16px;border:2px solid var(--ink);border-radius:4px;position:relative;padding:1px}
.batt-cell::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:6px;background:var(--ink);border-radius:0 2px 2px 0}
.batt-fill{height:100%;border-radius:2px;background:var(--ok)}
.batt-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.batt-txt strong{font-family:var(--f-mono);font-size:14px}
.batt-txt span{font-size:12px;color:var(--muted)}
@media (max-width:400px){ .brandcol{flex-direction:column;align-items:flex-start;gap:2px} }
@media (max-width:359px){ .batt-txt span{display:none} }
.demo-flag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 6px;white-space:nowrap}

/* banners */
.banner{border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.banner.info{background:var(--info-soft);border:1px solid var(--info)}
.banner.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.banner .ico{font-weight:800;font-family:var(--f-mono)}

/* tabs */
.tabbar{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{background:none;border:0;padding:8px 1px 10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:12px;line-height:1.15;text-align:center;font-weight:600;color:var(--muted);cursor:pointer;min-height:58px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.4}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:46px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{min-height:56px;font-size:16px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.fade{padding-right:28px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=text],input[type=number],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
input[type=range]{margin:0;width:100%;accent-color:var(--accent);min-height:44px}
label.field{overflow-wrap:anywhere;display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:379px){ .grid2{grid-template-columns:1fr} }
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--muted)}
.suggest{position:absolute;left:0;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:8;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.suggest button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.suggest button:last-child{border-bottom:0}

/* map */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--map-land)}
.mapwrap svg{display:block;width:100%;height:auto}
.pin{cursor:pointer}
.pin text{font-family:var(--f-mono);font-weight:600;font-size:12px;pointer-events:none}
.maplegend{position:absolute;left:8px;bottom:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 16px)}
.maplegend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-grid;place-items:center;font-size:8px;font-weight:800;color:#fff;font-family:var(--f-mono)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:650;border:1px solid transparent;white-space:normal;max-width:100%;overflow-wrap:anywhere}
.pill i{flex:none;font-style:normal;font-family:var(--f-mono);font-weight:700}
.t-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.t-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.t-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.t-info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.t-mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.src{overflow-wrap:anywhere;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px}
.src.live{background:var(--ok-soft);color:var(--ok)} .src.report{background:var(--info-soft);color:var(--info)} .src.predict{background:var(--warn-soft);color:var(--warn)} .src.none,.src.stale{background:var(--surface-2);color:var(--muted)}

/* station card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.scard{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.scard.top{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scard-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.scard-h > div{min-width:0}
.scard-h h3{font-size:17px}
.rank{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--surface-2);border-radius:7px;padding:3px 7px}
.rank.best{background:var(--accent);color:var(--accent-ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.why{border-top:1px dashed var(--line);padding-top:9px;font-size:13.5px}
.why b{font-weight:700}
.range{color:var(--muted);font-size:12.5px}

/* bars */
.tbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.tbar span{display:block;height:100%}
.seg-drive{background:var(--info)} .seg-wait{background:var(--warn);background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.28) 5px 10px)} .seg-charge{background:var(--accent)} .seg-unknown{background:repeating-linear-gradient(45deg,var(--surface-2) 0 5px,var(--line) 5px 10px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

.socbar{position:relative;height:28px;border-radius:8px;background:var(--surface-2);overflow:visible;margin-top:18px}
.socbar .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:8px}
.socbar .mid{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent);border-radius:2px}
.socbar .res{position:absolute;top:-18px;bottom:0;border-left:2px dashed var(--bad)}
.socbar .res span{position:absolute;top:-1px;left:4px;font-size:12px;color:var(--bad);font-weight:700;white-space:nowrap}

table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
table.cmp th,table.cmp td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
table.cmp td.best{font-weight:700;color:var(--ok)}
table.cmp td.best::after{content:" ✓"}
.scrollx{overflow-x:auto}
table.cmp th[scope=row]{position:sticky;left:0;background:var(--surface);width:84px;min-width:84px;max-width:84px;z-index:1;overflow-wrap:anywhere}
table.cmp thead th:not(:first-child),table.cmp td{min-width:92px}
.cmpwrap{position:relative}
@media (max-width:459px){ .cmpwrap:not(.end)::after{content:"";position:absolute;right:1px;top:1px;bottom:1px;width:28px;background:linear-gradient(to left,var(--surface),transparent);pointer-events:none;border-radius:0 var(--r) var(--r) 0} }

.verdict{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.verdict.stay{background:var(--info-soft);border:1px solid var(--info)}
.verdict.switch{background:var(--ok-soft);border:1px solid var(--ok)}
.verdict.close{background:var(--surface-2);border:1px solid var(--line)}
.verdict h2{font-size:24px}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{width:56px;height:52px;border:0;background:var(--surface-2);font-size:22px;font-weight:700;cursor:pointer}
.stepper output{min-width:64px;text-align:center;font-family:var(--f-mono);font-size:20px;font-weight:600}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:46px 18px 1fr;gap:0 10px;min-height:54px}
.tl-km{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--line)}
.tl-rail i{position:relative;margin-top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.tl-item.stop .tl-rail i{border-color:var(--accent);background:var(--accent)}
.tl-item.end .tl-rail i{border-color:var(--ink);background:var(--ink)}
.tl-item.gap .tl-rail i{border-color:var(--bad)}
.tl-body{padding-bottom:14px;min-width:0}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;flex:1}
.msg{max-width:88%;border-radius:16px;padding:10px 13px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.bot .mini,.msg.bot .btn{margin-block:6px}
.msg.bot .mini{display:flex}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.mini{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);cursor:pointer;text-align:left;width:100%}

/* priorities */
.prio{display:flex;flex-direction:column;gap:6px}
.prio-item{display:grid;grid-template-columns:28px 1fr auto auto;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px 6px 6px 10px}
.prio-item span{min-width:0;overflow-wrap:anywhere}
.prio-item b{font-family:var(--f-mono);color:var(--accent)}
.prio-item button{width:44px;height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;cursor:pointer;font-size:16px}

/* onboarding */
.onb{flex:1;display:flex;flex-direction:column;gap:16px;padding:20px 16px 0}
.bar{position:sticky;bottom:0;z-index:4;margin-top:auto;background:var(--bg);padding:10px 0 max(14px,env(safe-area-inset-bottom));box-shadow:0 -10px 10px -10px rgba(0,0,0,.2)}
.dots{display:flex;gap:6px}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.hero-onb{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:44px;line-height:.98;letter-spacing:-.025em}
.hero-onb em{font-style:normal;color:var(--accent)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:48px;cursor:pointer;font-size:14px}
.checks input{width:20px;height:20px;accent-color:var(--accent)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sect{display:flex;flex-direction:column;gap:10px}
details.card summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
details.card summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--muted)}
details.card[open] summary::after{content:"–"}
details.card[open] summary{margin-bottom:10px}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
/* language */
.lang-list{display:grid;gap:10px}
.lang-opt{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:68px}
.lang-opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.lang-glyph{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;font-weight:700}
.lang-opt[aria-pressed="true"] .lang-glyph{background:var(--accent);color:var(--accent-ink)}
.lang-opt b{font-size:18px}
.lang-opt .tick{font-family:var(--f-mono);font-weight:700;color:var(--accent);visibility:hidden}
.lang-opt[aria-pressed="true"] .tick{visibility:visible}
html:not([lang="en"]) .eyebrow, html:not([lang="en"]) .facts dt, html:not([lang="en"]) table.cmp th{letter-spacing:0;text-transform:none}
html:not([lang="en"]) body{line-height:1.55}
html:not([lang="en"]) h1, html:not([lang="en"]) h2, html:not([lang="en"]) h3{font-stretch:100%;letter-spacing:0;line-height:1.3}
/* splash */
[hidden]{display:none!important}
.splash{position:fixed;inset:0;z-index:30;background:var(--logo-ground);display:grid;place-items:center;cursor:pointer}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
.splash img{width:min(88vw,460px);height:auto;display:block}
.splash .ph{width:min(56vw,220px);aspect-ratio:1;border-radius:28%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(40px,12vw,64px);letter-spacing:-.03em}

.splash.out{opacity:0;transition:opacity .35s ease}
@media (prefers-reduced-motion:no-preference){ .splash-inner{animation:pop .7s cubic-bezier(.2,.8,.2,1) both} @keyframes pop{from{transform:scale(.88);opacity:.2}to{transform:none;opacity:1}} }
/* login (matches the approved mockup: deep green hero, cream form, lime action) */
.lg{--lg-bg:#F4F2EC;--lg-ink:#14201B;--lg-muted:#5B625D;--lg-line:#D9D9D2;--lg-field:#F7F6F1;--lg-lime:#C6F45A;--lg-lime-ink:#14201B;--lg-link:#0E5E57;--lg-err:#B42318;
  --lg-sans:"Manrope","Public Sans",system-ui,sans-serif;
  flex:1;display:flex;flex-direction:column;background:var(--lg-bg);color:var(--lg-ink);font-family:var(--lg-sans);min-height:100%}
.lg-hero{position:relative;min-height:clamp(150px,26vh,360px);display:flex;flex-direction:column;justify-content:flex-end;padding:56px 24px 96px;overflow:hidden;color:#fff;flex:none}
.lg-hero svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg-hero .fade{position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to bottom,rgba(244,242,236,0),var(--lg-bg) 92%)}
.lg-brand{position:absolute;top:28px;left:24px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:30px;letter-spacing:-.02em}
.lg-brand svg{width:30px;height:38px}
.lg-hello{position:relative;z-index:1}
.lg-hello h1{font-family:var(--lg-sans);font-stretch:100%;font-weight:700;font-size:34px;letter-spacing:-.025em;color:#fff;text-shadow:0 1px 18px rgba(0,0,0,.35)}
.lg-hello p{font-size:17px;color:rgba(255,255,255,.82);margin-top:4px}
.lg-body{padding:6px 24px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;position:relative;margin-top:-28px;width:100%;max-width:440px;margin-inline:auto}
@media (max-height:700px){ .lg-brand{top:14px;font-size:24px}.lg-brand svg{width:24px;height:30px}.lg-hero{padding:54px 24px 44px}.lg-hello h1{font-size:26px}.lg-hello p{font-size:15px}.lg .fade{height:60px} }
.lg label.lgl{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:15px}
.lg-field{display:flex;align-items:center;gap:12px;border:1px solid var(--lg-line);border-radius:14px;background:var(--lg-field);padding:0 14px;min-height:56px}
.lg-field:focus-within{border-color:var(--lg-link);outline:3px solid var(--lg-link);outline-offset:2px}
.lg-field svg{width:22px;height:22px;flex:none;color:var(--lg-ink)}
.lg-field input{flex:1;min-width:0;border:0;background:transparent;font:500 16px var(--lg-sans);color:var(--lg-ink);min-height:54px;padding:0;width:auto}
.lg-field input::placeholder{color:#666C67}
.lg-field input:focus{outline:none}
.lg-eye{border:0;background:none;width:44px;height:44px;margin-right:-10px;padding:0;cursor:pointer;color:var(--lg-ink);display:grid;place-items:center;border-radius:8px}
.lg-link{border:0;background:none;color:var(--lg-link);font:700 15px var(--lg-sans);cursor:pointer;padding:4px 0;min-height:44px;display:inline-flex;align-items:center}
.lg-forgot{align-self:flex-end;margin-top:-4px}
.lg-primary{display:grid;grid-template-columns:24px 1fr 24px;align-items:center;width:100%;min-height:60px;border:0;border-radius:16px;background:var(--lg-lime);color:var(--lg-lime-ink);font:700 18px var(--lg-sans);cursor:pointer;padding:0 20px;margin-top:6px}
.lg-primary span{grid-column:2}
.lg-primary svg{grid-column:3;width:22px;height:22px}
.lg-primary:hover{filter:brightness(.97)}
.lg-or{display:flex;align-items:center;gap:14px;color:var(--lg-muted);font-size:14.5px;font-weight:500}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--lg-line)}
.lg-alt{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;border:1px solid var(--lg-line);border-radius:14px;background:var(--lg-field);font:600 16px var(--lg-sans);color:var(--lg-ink);cursor:pointer}
.lg-alt svg{width:22px;height:22px}
.lg-foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;text-align:center;color:var(--lg-muted);font-size:15px;font-weight:500}
.lg-foot .lg-link{margin-left:4px}
.lg-err{color:var(--lg-err);font-size:14px;font-weight:600}
.lg-note{font-size:12px;color:var(--lg-muted);text-align:center;line-height:1.5}
.lg-guest{align-self:center;font-weight:600;font-size:14px;color:var(--lg-muted)}
.lg-back{position:absolute;top:22px;right:16px;border:0;background:rgba(255,255,255,.14);color:#fff;font:700 15px var(--lg-sans);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.lg.ld .lg-hero{min-height:clamp(170px,30vh,330px);padding-bottom:60px}
.lg.ld .fade{height:70px}
.lg.ld .lg-hello h1{font-size:clamp(24px,7.5vw,36px)}
.lg.ld .lg-hello p{font-size:15px}

.ld-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ld-points li{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15.5px}
.ld-points i{flex:none;width:32px;height:32px;border-radius:10px;background:var(--lg-lime);color:var(--lg-lime-ink);display:grid;place-items:center;font-style:normal;font-weight:800}
.ld-lang{align-self:center;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--lg-muted)}
.ld-lang select{border:1px solid var(--lg-line);border-radius:10px;background:var(--lg-field);color:var(--lg-ink);padding:6px 8px;min-height:44px;width:auto}
.lg-ok{background:#E9F6D4;border:1px solid #A9D46A;border-radius:12px;padding:12px 14px;font-size:14.5px}
/* vehicle type + model */
.types{display:grid;gap:10px}
.type{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;min-height:96px}
.type svg{width:84px;height:56px;color:var(--ink)}
.type[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.type b{font-family:var(--f-display);font-stretch:85%;font-size:19px}
.models{display:flex;flex-direction:column;gap:8px}
.model{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.model[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.model .specs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.spec{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--muted)}
.brandgroup{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.report{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.report:last-child{border-bottom:0}
.histchart text{font-family:var(--f-mono);font-size:14px;fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .scard,.btn,.chip{transition:border-color .15s,background .15s} }
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => n==null ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const r0 = n => Math.round(n);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
function mins(m){ if(m==null) return '—'; m=Math.round(m); if(m<60) return t('{n} min',{n:m}); return t('{h} h {m} min',{h:Math.floor(m/60), m:String(m%60).padStart(2,'0')}); }
function ago(min){ if(min<1) return t('just now'); if(min<60) return t('{n} min ago',{n:r0(min)}); const h=min/60; if(h<24) return t('{n} h ago',{n:(h<10? h.toFixed(1).replace('.0',''):r0(h))}); return t('{n} d ago',{n:r0(h/24)}); }
function clock(x){ return new Date(x).toLocaleTimeString(locale(),{hour:'numeric',minute:'2-digit'}); }
function hav(a,b){ const R=6371, toR=x=>x*Math.PI/180; const dLa=toR(b.lat-a.lat), dLo=toR(b.lng-a.lng); const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const roadKm = (a,b) => hav(a,b)*1.35;
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2600); }
const nowMin = () => (Date.now() - S.lastRefresh)/60e3;

/* ---------- estimation engine ---------- */
function consFactor(highway){ return (TEMP_C>=32 && S.vehicle.type==='car' ? 1.07 : 1) * (highway ? 1.15 : 1); }
function rangeKm(soc=S.soc){ const v=S.vehicle; const km = soc/100*v.usable/(v.cons*consFactor(false)/1000); return {mid:km, lo:km*0.85, hi:km*1.08}; }
function plugPower(p){ const v=S.vehicle; if(!v.connectors.includes(p.type)) return 0; return Math.min(p.kw, CONN[p.type].dc ? v.maxDC : v.maxAC); }
function bestPlug(st){ let b=null; for(const p of st.plugs){ const kw=plugPower(p); if(kw>0 && (!b || kw>b.kw)) b={type:p.type, rated:p.kw, kw, n:p.n, dc:CONN[p.type].dc}; } return b; }
function compatPlugCount(st){ return st.plugs.filter(p=>plugPower(p)>0).reduce((a,p)=>a+p.n,0); }
// Generic taper: DC full power to 50 %, 72 % to 80 %, 38 % above. AC flat to 95 %.
function chargeMinutes(from, to, kw, dc){
  let m=0; const per=S.vehicle.usable/100;
  for(let s=Math.max(0,Math.floor(from)); s<Math.ceil(to); s++){
    const f = dc ? (s<50?1 : s<80?.72 : .38) : (s<95?1:.5);
    m += per/(kw*f*0.93)*60;
  }
  return m;
}
function availability(st){
  const s=st.status, compN=compatPlugCount(st), age=s.age + nowMin();
  let src=s.src, stale=false;
  if(src==='live' && (S.providerDown || age>60)) stale=true;
  const broken=s.broken||0;
  if(src==='none') return {src:'none', srcLabel:t('No status'), tone:'mute', icon:'?', text:t('Status unknown'), fresh:t('No live feed or recent report'), conf:t('Unknown'), confN:.3, wait:null, wlo:null, whi:null};
  if(src==='predict'){
    const p=s.pAvail, w=(1-p)*22;
    return {src:'predict', srcLabel:t('Prediction'), tone:'warn', icon:'~', text:t('{p}% likely free on arrival',{p:r0(p*100)}), fresh:t('Predicted from 8 weeks of usage history'), conf:t('Low–medium'), confN:.55, wait:w, wlo:0, whi:w*2.2};
  }
  const free=Math.max(0,(s.free??0)), total=s.total??compN, q=s.queue??0;
  let tone, icon, text;
  if(broken && free===0){ tone='bad'; icon='!'; text=t('Reported out of order'); }
  else if(free>0){ tone='ok'; icon='✓'; text=t('{a} of {b} free',{a:free,b:total}); }
  else { tone='warn'; icon='◷'; text= q ? t('All busy · {q} waiting',{q}) : t('All busy'); }
  if(broken) text += ' · '+t('{n} reported faulty',{n:broken});
  let wait = free>0 ? 0 : ((q*AVG_SESSION)+AVG_SESSION/2)/Math.max(1,compN);
  let wlo = free>0 ? 0 : wait*.6, whi = free>0 ? 6 : wait*1.5;
  let conf, confN;
  if(src==='live'){ if(stale){ conf=t('Low (stale)'); confN=.35; whi=Math.max(whi, wait+25); } else if(age<=15){ conf=t('High'); confN=1; } else { conf=t('Medium'); confN=.75; } }
  else { conf = age<=30 ? t('Medium') : t('Low'); confN = age<=30 ? .65 : .45; whi = whi + 10; }
  const srcLabel = src==='live' ? (stale ? (S.providerDown ? t('Last known') : t('Stale')) : t('Live')) : t('User report');
  const freshTxt = src==='live' ? t('Network feed · {t}',{t:ago(age)}) : t('Driver report · {t}',{t:ago(age)});
  return {src: stale?'stale':src, srcLabel, tone, icon, text, fresh:freshTxt, conf, confN, wait, wlo, whi, ageMin:age};
}
function estimate(st, origin=S.loc, soc=S.soc){
  const v=S.vehicle, km=roadKm(origin, st), eta=km/CITY_KMH*60;
  const kwh=km*v.cons*consFactor(false)/1000;
  const arr=soc - kwh/v.usable*100, arrLo=soc - kwh*1.2/v.usable*100, arrHi=soc - kwh*.9/v.usable*100;
  const plug=bestPlug(st), av=availability(st);
  const target=Math.max(S.target, arr);
  const from=Math.max(arr,0);
  const charge = plug ? chargeMinutes(from, target, plug.kw, plug.dc) : null;
  const kwhIn=(target-from)/100*v.usable, billed=kwhIn/0.93;
  const cost = st.price!=null && plug ? billed*st.price : null;
  let reach = arrLo>=S.reserve ? 'safe' : arr>=S.reserve ? 'tight' : arr>2 ? 'below' : 'no';
  const total = plug ? eta + (av.wait??0) + charge : null;
  return {st, km, eta, arr, arrLo, arrHi, plug, av, charge, kwhIn, billed, cost, reach, total, target};
}
function reachPill(e){
  const m={safe:['ok','✓',t('Reachable with reserve')], tight:['warn','!',t('Tight: reserve at risk')], below:['bad','!',t('Below your reserve')], no:['bad','✕',t('Not reachable')]}[e.reach];
  return pill(m[0], m[1], m[2]);
}
function compatPill(st){
  const p=bestPlug(st);
  if(!p){ const types=[...new Set(st.plugs.map(x=>CONN[x.type].label))].join(', '); return pill('bad','✕',t('Not compatible · {c}',{c:types})); }
  if(!p.dc) return pill('warn','~',t('AC only · {kw} kW for your {v}',{kw:p.kw,v:vword()}));
  return pill('ok','✓',t('Compatible · {c}',{c:CONN[p.type].label}));
}
function vword(){ return t({car:'car','2w':'scooter','3w':'auto'}[S.vehicle.type]||'EV'); }
const lc = x => (!S.lang||S.lang==='en') ? String(x).toLowerCase() : x;
function pill(tone, icon, text){ return `<span class="pill t-${tone}"><i aria-hidden="true">${icon}</i>${esc(text)}</span>`; }
function srcTag(av){ return `<span class="src ${av.src}">${esc(av.srcLabel)}</span>`; }

/* ranking with user priorities */
function rankAll(origin=S.loc, soc=S.soc, list=ST){
  const all=list.map(st=>estimate(st, origin, soc));
  const ok=all.filter(e=>e.plug && e.reach!=='no');
  if(!ok.length) return all.map(e=>({...e, score:-1, reasons:[], caveats:caveats(e)}));
  const prefNets=prefNetworks();
  const metric = {
    time:e=>-(e.total + (e.av.wait==null?20:0)),
    cost:e=>-(e.cost ?? median(ok.map(x=>x.cost).filter(x=>x!=null))*1.1),
    rel:e=>e.st.rel*e.av.confN,
    reserve:e=>e.arrLo,
    stops:e=>e.plug.kw,
  };
  const norm={};
  for(const k in metric){ const vals=ok.map(metric[k]); const mn=Math.min(...vals), mx=Math.max(...vals); norm[k]=e=> mx===mn ? .5 : (metric[k](e)-mn)/(mx-mn); }
  for(const e of ok){
    let s=0; const parts=[];
    S.prios.forEach((k,i)=>{ const v=norm[k](e)*WEIGHTS[i]; s+=v; parts.push({k, v, n:norm[k](e)}); });
    if(e.reach==='tight') s-=.12; if(e.reach==='below') s-=.45;
    if(!e.plug.dc) s-=.1;
    if(e.av.tone==='bad') s-=.5;
    if(S.personal.on && prefNets.includes(e.st.net)) s+=.03;
    e.score=s; e.parts=parts;
  }
  for(const e of all){ if(e.score==null) e.score=-1; e.reasons=reasons(e); e.caveats=caveats(e); }
  return all.sort((a,b)=>b.score-a.score);
}
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function reasons(e){
  if(!e.plug) return [];
  const top=[...(e.parts||[])].sort((a,b)=>(b.v)-(a.v)).filter(p=>p.n>.65).slice(0,2);
  const txt={
    time:()=>t('quick overall: ~{t} to drive, wait and charge',{t:mins(e.total)}),
    cost:()=> e.cost!=null ? t('low estimated cost ({c})',{c:inr(e.cost)}) : t('cost not published'),
    rel:()=>t('good reliability record ({p}% of sessions succeed)',{p:r0(e.st.rel*100)}),
    reserve:()=>t('arrives with more battery (~{p}%)',{p:r0(e.arr)}),
    stops:()=>t('{kw} kW for your {v}, so a shorter stop',{kw:e.plug.kw,v:vword()}),
  };
  const out=top.map(p=>txt[p.k]());
  if(S.personal.on && prefNetworks().includes(e.st.net)) out.push(t('you often choose {n}',{n:e.st.net}));
  return out;
}
function caveats(e){
  const c=[];
  if(!e.plug) return [t('No connector here fits your {v}',{v:vword()})];
  if(e.av.src==='stale') c.push(S.providerDown ? t('Network feed is down; showing last known status') : t('Status is {t} old',{t:ago(e.av.ageMin)}));
  if(e.av.src==='none') c.push(t('No live status or recent reports'));
  if(e.av.src==='predict') c.push(t('Availability is a prediction, not live'));
  if(e.av.src==='report') c.push(t('Status comes from a driver report'));
  if(e.st.status.broken) c.push(t('A connector was reported faulty'));
  if(e.cost==null) c.push(t('Price not published'));
  if(e.reach==='tight') c.push(t('Battery reserve could be eaten into'));
  if(e.reach==='below') c.push(t('Arrival battery below your reserve'));
  if(!e.plug.dc) c.push(t('AC charging only: long stop'));
  return c;
}
function prefNetworks(){
  const n={}; S.personal.choices.forEach(c=>n[c.net]=(n[c.net]||0)+1);
  return Object.keys(n).filter(k=>n[k]>=2);
}
const fastKw = () => S.vehicle.type==='car' ? 50 : 3;
function passesFilters(e){
  const f=S.filters;
  if(f.compat && !e.plug) return false;
  if(f.fast && !(e.plug && e.plug.dc && e.plug.kw>=fastKw())) return false;
  if(f.avail && !(e.av.tone==='ok')) return false;
  if(f.food && !e.st.amen.includes('food')) return false;
  return true;
}

function mapB(){ const W=clamp(document.documentElement.clientWidth-34,288,400), H=Math.round(W*.725); if(!liveMap()) return {...BH,W,H}; const la=S.loc.lat, ln=S.loc.lng; return {w:ln-.11,e:ln+.11,n:la+.075,s:la-.075,W,H}; }
let B=BH;
const px = p => [ (p.lng-B.w)/(B.e-B.w)*B.W, (B.n-p.lat)/(B.n-B.s)*B.H ];
function mapView(){
  const ranked=rankAll(), shown=ranked.filter(passesFilters);

  </div>
  <div class="chips wrap" role="group" aria-label="Filters">
    ${[['compat',t('Fits my {v}',{v:vword()})],['fast',S.vehicle.type==='car'?t('Fast ≥ 50 kW'):t('DC fast')],['avail',t('Free now')],['food',t('Food nearby')]].map(([k,l])=>`<button class="chip" data-act="filter" data-k="${k}" aria-pressed="${f[k]}">${l}</button>`).join('')}
  </div>
  <div class="row spread">
    <div class="seg" role="group" aria-label="View"><button data-act="mode" data-v="map" aria-pressed="${S.mapMode==='map'}">${t('Map')}</button><button data-act="mode" data-v="list" aria-pressed="${S.mapMode==='list'}">${t('List')}</button></div>
    <button class="btn" data-act="compareTop">${t('Compare top 3')}</button>
  </div>
  ${S.mapMode==='map' ? mapSvg(ranked, shown) + (sel(shown, best)) : listCards(shown, best)}
  `;
}
function sel(shown,best){
  const e = shown.find(x=>x.st.id===S.selected) || best;
  if(!e) return `<div class="card muted">${t('No stations match these filters. Turn off a filter to see more.')}</div>`;
  return stationCard(e, e===best);
}
function placeSuggest(){
  const q=S.placeQuery.trim().toLowerCase(); if(!q) return '';
  const m=SRV.on ? (S.placeResults||[]).slice(0,6) : PLACES.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5);
  if(!m.length) return `<div class="suggest"><button disabled>${SRV.on&&S.placeDone!==S.placeQuery.trim()?'…':t('No places found. Try a nearby area name.')}</button></div>`;
  return `<div class="suggest">${m.map(p=>`<button data-act="setplace" data-n="${esc(p.name)}">${esc(p.name)}${p.address&&p.address!==p.name?`<br><span class="small muted">${esc(p.address)}</span>`:''}</button>`).join('')}</div>`;
}
function mapSvg(ranked, shown){
  B=mapB(); const live=liveMap();
  const [ux,uy]=px(S.loc);
  const road=(pts,w=5)=>`<polyline points="${pts.map(p=>px({lat:p[0],lng:p[1]}).join(',')).join(' ')}" fill="none" stroke="var(--map-road)" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const label=(t,lat,lng)=>{const [x,y]=px({lat,lng}); return `<text x="${x}" y="${y}" fill="var(--map-text)" font-size="12" font-family="var(--f-body)" font-weight="600" letter-spacing=".06em">${t}</text>`;};

    ${road([[17.4948,78.3996],[17.4504,78.3810],[17.4435,78.3772],[17.4316,78.4070],[17.4140,78.4380],[17.4050,78.4700]])}
    ${road([[17.4401,78.3489],[17.4435,78.3772],[17.4375,78.4482],[17.4399,78.4983]])}
    ${road([[17.4170,78.3440],[17.4235,78.3720],[17.4346,78.3866],[17.4316,78.4070]],4)}

    ${road([[17.4950,78.40],[17.47,78.45],[17.4399,78.4983]],4)}
    ${label('ORR',17.468,78.333)}${label('HITEC CITY',17.462,78.372)}${label('GACHIBOWLI',17.452,78.334)}${label('JUBILEE HILLS',17.424,78.395)}${label('BANJARA HILLS',17.405,78.425)}${label('KUKATPALLY',17.506,78.402)}${label('HUSSAIN SAGAR',17.415,78.462)}${label('SECUNDERABAD',17.452,78.478)}${label('FIN. DISTRICT',17.408,78.334)}

function listCards(shown,best){
  if(!shown.length) return `<div class="card muted">${t('No stations match these filters. Turn off a filter to see more.')}</div>`;
  return `<div class="stack">${shown.map((e,i)=>stationCard(e, e===best, i+1)).join('')}</div>`;
}
function stationCard(e, isBest, n){
  const st=e.st, av=e.av;
  if(n==null){ const l=rankAll().filter(passesFilters); n=l.findIndex(x=>x.st.id===st.id)+1; }
  const why = !e.plug ? `<b>${t('Not a fit:')}</b> ${esc(t('No connector here works with your {m}.',{m:S.vehicle.model}))}` :
    `<b>${isBest?t('Best match for your priorities:'):t('Why it may fit:')}</b> ${e.reasons.length? esc(e.reasons.join('; ')) : t('average on your priorities')}.${e.caveats.length?` <span class="muted">${t('Watch:')} ${esc(e.caveats.slice(0,2).join('; '))}.</span>`:''}`;

      <dt>${t('Speed')}</dt><dd class="num">${e.plug? `${t('{kw} kW for your {v}',{kw:e.plug.kw,v:vword()})} <span class="range">${t('(rated {kw} kW)',{kw:e.plug.rated})}</span>` : '—'}</dd>
      <dt>${t('Time')}</dt><dd class="num">${e.plug? `${av.wait==null?t('Wait unknown'):av.wait<1?t('No wait expected'):t('Wait ~{t}',{t:mins(av.wait)})} · ${t('charge ~{t} to {p}%',{t:mins(e.charge),p:r0(e.target)})}` : '—'}</dd>
      <dt>${t('Cost')}</dt><dd class="num">${e.plug ? (e.cost!=null?`~${inr(e.cost)} <span class="range">${t('at ₹{p}/kWh',{p:st.price})}</span>`:t('Price not published')) : '—'}</dd>

  </button>`;
}

function timeBar(parts){
  const tot=parts.reduce((a,p)=>a+(p.v??15),0)||1;
  return `<div class="tbar" role="img" aria-label="${parts.map(p=>`${p.k} ${p.v==null?'unknown':r0(p.v)+' min'}`).join(', ')}">${parts.map(p=>`<span class="${p.v==null?'seg-unknown':'seg-'+p.k}" style="width:${(p.v??15)/tot*100}%"></span>`).join('')}</div>
  <div class="legend"><span><i class="seg-drive"></i>${t('Drive')}</span><span><i class="seg-wait"></i>${t('Wait')}</span><span><i class="seg-charge"></i>${t('Charge')}</span><span><i class="seg-unknown"></i>${t('Unknown')}</span></div>`;
}

/* ---------- COMPARE ---------- */
function compareView(){
  const all=rankAll();
  S.compare=S.compare.filter(id=>all.some(e=>e.st.id===id));            // drop stations no longer in the list
  if(!S.compare.length) S.compare=all.filter(e=>e.plug&&e.reach!=='no').slice(0,3).map(e=>e.st.id);
  const es=S.compare.map(id=>all.find(e=>e.st.id===id)).filter(Boolean);
  const rows=[
    [t('Speed for your {v}',{v:vword()}), e=>e.plug?.kw, v=>v+' kW', 'max'],
    [t('Estimated wait'), e=>e.av.wait, v=>v==null?t('Unknown'):mins(v), 'min', true],
    [t('Drive time'), e=>e.eta, mins, 'min'],
    [t('Charge time'), e=>e.charge, mins, 'min'],
    [t('Total time'), e=>e.total, mins, 'min'],
    [t('Cost'), e=>e.cost, inr, 'min'],
    [t('Arrival battery'), e=>e.arr, v=>'~'+r0(v)+'%', 'max'],
    [t('Availability confidence'), e=>e.av.confN, (v,e)=>e.av.conf, 'max'],
    [t('Distance'), e=>e.km, v=>v.toFixed(1)+' km', 'min'],
  ];
  return `<div class="row"><button class="btn ghost" data-act="tab" data-v="map">${t('← Back')}</button></div>
  <div><span class="eyebrow">${t('Station comparison')}</span><h1>${t('Compare chargers')}</h1><p class="small muted">${t('Best value in each row is marked ✓. Unknown values never win a row.')}</p></div>
  <div class="card cmpwrap" style="padding:0"><div class="scrollx"><table class="cmp"><thead><tr><th></th>${es.map(e=>`<th>${esc(e.st.name)}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(([l,get,fmt,dir,showNull])=>{const vals=es.map(get); const known=vals.filter(v=>v!=null); const best=known.length? (dir==='max'?Math.max(...known):Math.min(...known)) : null;
    return `<tr><th scope="row">${l}</th>${es.map((e,i)=>`<td class="num ${vals[i]!=null&&vals[i]===best&&known.length>1?'best':''}">${vals[i]==null && !showNull ? '—' : fmt(vals[i],e)}</td>`).join('')}</tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card sect"><h3>${t("Change what's compared")}</h3>
    <div class="stack">${all.filter(e=>e.plug).map(e=>`<label class="row" style="min-height:44px"><input type="checkbox" data-act="cmpToggle" data-id="${e.st.id}" ${S.compare.includes(e.st.id)?'checked':''} style="width:20px;height:20px;accent-color:var(--accent)"> ${esc(e.st.name)} <span class="muted small">${e.km.toFixed(1)} km</span></label>`).join('')}</div>
    <p class="small muted">${t('Pick up to 3.')}</p>
  </div>`;
}

/* ---------- STAY OR SWITCH ---------- */
function switchView(){
  const cur=ST.find(s=>s.id===S.stay.station)||ST.find(s=>bestPlug(s))||ST[0];
  if(!cur) return `<div class="card muted">${t('No stations match these filters. Turn off a filter to see more.')}</div>`;
  S.stay.station=cur.id;
  const plug=bestPlug(cur);
  const per=compatPlugCount(cur)||1;
  // Every compatible plug is busy. Wait = cars ahead plus the remaining time of the car on the plug, spread across plugs.
  const stayW = (S.stay.ahead*AVG_SESSION + Math.max(0, AVG_SESSION - S.stay.elapsed))/per;
  const stayCharge = plug ? chargeMinutes(S.soc, Math.max(S.target,S.soc), plug.kw, plug.dc) : null;
  const stayCost = plug && cur.price!=null ? (Math.max(S.target,S.soc)-S.soc)/100*S.vehicle.usable/0.93*cur.price : null;
  const stay = {wait:stayW, wlo:stayW*.7, whi:stayW*1.4+5, charge:stayCharge, total: stayW+(stayCharge||0), cost:stayCost};
  const alts = rankAll(cur, S.soc).filter(e=>e.st.id!==cur.id && e.plug && e.reach!=='no' && e.av.tone!=='bad' && (e.plug.dc || !S.vehicle.maxDC || S.vehicle.type!=='car'))
    .sort((a,b)=>(a.total+(a.av.wait==null?20:0))-(b.total+(b.av.wait==null?20:0))).slice(0,3);
  const best=alts[0];
  let verdict;
  if(!plug){ verdict={cls:'switch', h:t('Switch'), why:t('No connector at this station fits your {v}.',{v:vword()})+(best?'':' '+t('No alternative is reachable with your battery reserve.'))}; }
  else if(!best){ verdict={cls:'stay', h:t('Stay'), why:t('No alternative is reachable with your battery reserve.')}; }
  else {
    const bestPess = best.eta + (best.av.whi ?? 30) + best.charge;
    const save = stay.total - best.total, savePess = stay.total - bestPess;
    if(best.reach!=='safe' && save<25) verdict={cls:'stay', h:t('Stay'), why:t('Switching to {n} would save about {t}, but your arrival battery could dip below your {r}% reserve.',{n:best.st.name,t:mins(Math.max(0,save)),r:S.reserve})};
    else if(savePess>=8 && best.av.confN>=.6) verdict={cls:'switch', h:t('Switch to {n}',{n:best.st.name}), why:t('Saves about {t} even if the wait there runs long. {s} status, {c} confidence.',{t:mins(save),s:best.av.srcLabel,c:lc(best.av.conf)})};
    else if(save>=10) verdict={cls:'close', h:t('Probably switch, but check first'), why:t("Expected to save about {t}, but the status there is {s} ({c} confidence). If it's busy when you arrive, you could lose time. Refresh before you leave.",{t:mins(save),s:lc(best.av.srcLabel),c:lc(best.av.conf)})};
    else if(save>-5) verdict={cls:'close', h:t('Too close to call: stay'), why:t('The difference is about {t}, smaller than the uncertainty in the wait estimates. Staying avoids the risk.',{t:mins(Math.abs(save))})};
    else verdict={cls:'stay', h:t('Stay'), why:t('Staying is about {t} faster than the best alternative.',{t:mins(-save)})};
  }
  const maxT=Math.max(stay.total, ...alts.map(a=>a.total+(a.av.wait==null?15:0)), 1);
  const bar=(drive,wait,charge)=>`<div class="tbar" style="width:${(drive+(wait??15)+charge)/maxT*100}%">${drive?`<span class="seg-drive" style="width:${drive/(drive+(wait??15)+charge)*100}%"></span>`:''}<span class="${wait==null?'seg-unknown':'seg-wait'}" style="width:${(wait??15)/(drive+(wait??15)+charge)*100}%"></span><span class="seg-charge" style="width:${charge/(drive+(wait??15)+charge)*100}%"></span></div>`;
  return `
  <div><span class="eyebrow">${t('Should I stay or switch?')}</span><h1>${t("You're at a busy charger")}</h1></div>
  <div class="card sect">
    <label class="field">${t("Station you're at")}<select id="stayst" ${S.driving?'disabled':''}>${[...ST].sort((a,b)=>hav(S.loc,a)-hav(S.loc,b)).map(s=>`<option value="${s.id}" ${s.id===cur.id?'selected':''}>${esc(s.name)} (${esc(s.area)})</option>`).join('')}</select></label>
    <div class="row spread"><div><b>${t('Cars ahead of you')}</b><div class="small muted">${t('Compatible connectors here: {n}',{n:per})}</div></div>
      <div class="stepper"><button data-act="ahead" data-d="-1" aria-label="Fewer cars">−</button><output class="num">${S.stay.ahead}</output><button data-act="ahead" data-d="1" aria-label="More cars">+</button></div></div>
    <div class="row spread"><div><b>${t('Current car has charged for')}</b><div class="small muted">${t('Rough guess is fine')}</div></div>
      <div class="stepper"><button data-act="elapsed" data-d="-5" aria-label="Less time">−</button><output class="num">${S.stay.elapsed}m</output><button data-act="elapsed" data-d="5" aria-label="More time">+</button></div></div>
    <div class="small muted">${t('Battery now: {p}% ({s}). Target {g}%. Reserve {r}%.',{p:r0(S.soc),s:S.socSource==='manual'?t('manual entry'):t('vehicle'),g:S.target,r:S.reserve})}</div>
  </div>

  <div class="verdict ${verdict.cls}" role="status"><span class="eyebrow">${t('Recommendation')}</span><h2>${esc(verdict.h)}</h2><p>${esc(verdict.why)}</p></div>

  <div class="card sect">
    <h3>${t('Time to a {p}% battery',{p:S.target})}</h3>
    <div class="stack">
      <div><div class="row spread"><b>${t('Stay here')}</b><span class="num">~${mins(stay.total)}</span></div>${bar(0,stay.wait,stay.charge||0)}<div class="small muted num">${t('Wait ~{t}',{t:mins(stay.wait)})} (${mins(stay.wlo)}–${mins(stay.whi)}) · ${t('charge ~{t}',{t:mins(stay.charge)})} · ${inr(stay.cost)}</div></div>
      ${alts.map(a=>`<div><div class="row spread"><b>${esc(a.st.name)}</b><span class="num">~${mins(a.total)}${a.av.wait==null?' + ?':''}</span></div>${bar(a.eta,a.av.wait,a.charge)}
        <div class="small muted num">${t('Drive {km} km ~{t}',{km:a.km.toFixed(1),t:mins(a.eta)})} · ${a.av.wait==null?t('wait unknown'):t('Wait ~{t}',{t:mins(a.av.wait)})} · ${t('charge ~{t}',{t:mins(a.charge)})} · ${inr(a.cost)}</div>
        <div class="row" style="margin-top:4px">${reachPill(a)} ${srcTag(a.av)} <span class="small muted">${t('arrive ~{p}%',{p:r0(a.arr)})}</span></div></div>`).join('')}
    </div>
    ${timeLegend()}
  </div>
  <details class="card"><summary>${t('Assumptions')}</summary><ul class="tight">
    <li>Average session ${AVG_SESSION} min per car ahead, shared across compatible connectors.</li>
    <li>${t('Drive times are straight-line estimates, not live traffic. Alternatives use the same generic charging curve.')}</li>
    <li>"Switch" is recommended only if it still saves 8+ min with the pessimistic wait and confidence is medium or better.</li>
    <li>${S.vehicle.type==='car'?'Only DC chargers are offered as alternatives.':'AC sockets are included as alternatives for two- and three-wheelers.'}</li>
  </ul></details>`;
}
function timeLegend(){ return `<div class="legend"><span><i class="seg-drive"></i>${t('Drive')}</span><span><i class="seg-wait"></i>${t('Wait')}</span><span><i class="seg-charge"></i>${t('Charge')}</span><span><i class="seg-unknown"></i>${t('Unknown wait')}</span></div>`; }

/* ---------- TRIP PLANNER ---------- */
function planTrip(routeKey, startSoc){
  const R=CORRIDORS[routeKey], v=S.vehicle, f=consFactor(true);
  const fewer = S.prios.indexOf('stops')<=1;
  const maxT = fewer ? 90 : 80;
  const perKm = v.cons*f/1000/v.usable*100; // % per km
  const pess=1.2;
  const pts=[...R.stops.map(s=>({...s})), {km:R.km, name:R.dest, dest:true}];
  if(startSoc - pts[0].km*perKm <= 0) return {R, legs:[], drive:0, chargeT:0, cost:0, warn:null, maxT, fewer, total:0, error:t('Not enough battery to reach {n}. Charge before leaving.',{n:pts[0].name})};
  let soc=startSoc, pos=0, legs=[], drive=0, chargeT=0, cost=0, warn=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i]; const d=p.km-pos;
    const arr=soc - d*perKm, arrLo=soc - d*perKm*pess;
    drive += d/HWY_KMH*60;
    if(arrLo < S.reserve && !warn) warn = arrLo < S.reserve*0.6 ? t('Leg to {n} is risky: pessimistic arrival {p}%.',{n:p.name,p:r0(Math.max(0,arrLo))}) : t('Leg to {n} dips below your reserve: pessimistic arrival {p}%.',{n:p.name,p:r0(arrLo)});
    soc=Math.max(0,arr); pos=p.km;
    if(p.dest){ legs.push({...p, arr:soc, arrLo, type:'end'}); break; }
    // can we reach the next point safely without charging?
    const next=pts[i+1]; const need=(next.km-pos)*perKm*pess + S.reserve;
    if(soc >= need){ legs.push({...p, arr:soc, arrLo, type:'pass'}); continue; }
    // charge: enough to reach the furthest reachable point with reserve, up to maxT
    let target=maxT;
    const toDest=(R.km-pos)*perKm*pess + S.reserve;
    if(toDest<=maxT) target=Math.max(soc, Math.min(maxT, toDest+3));
    else {
      // fewest stops: charge to maxT; otherwise charge just enough to reach the stop after next with a margin
      if(!fewer){ const nn=pts[i+2]; if(nn){ const n2=(nn.km-pos)*perKm*pess + S.reserve + 3; target=Math.min(maxT, Math.max(need+3, n2>maxT?need+3:n2)); } }
    }
    target=clamp(target, soc, 95);
    const kw=Math.min(p.kw, v.maxDC);
    const tm=chargeMinutes(Math.max(0,soc), target, kw, true);
    const c=(target-soc)/100*v.usable/0.93*p.price;
    chargeT+=tm+5; cost+=c;
    legs.push({...p, arr:soc, arrLo, type:'stop', target, t:tm, c, kw});
    if(target < need) { legs[legs.length-1].gap = true; warn = warn || t('Gap after {n}: even {p}% may not reach {m} with your reserve.',{n:p.name,p:r0(target),m:next.name}); }
    soc=target;
  }
  return {R, legs, drive, chargeT, cost, warn, maxT, fewer, total:drive+chargeT};
}

        ${l.type==='stop'?`<div class="small num">${t('Charge to {p}%',{p:r0(l.target)})} · ${t('~{t} at up to {kw} kW',{t:mins(l.t),kw:l.kw})} · ~${inr(l.c)}</div><div class="small muted">${t('{p}% reliability',{p:r0(l.rel*100)})} · ${l.amen.map(a=>t(({food:'Food',restroom:'Restroom','24x7':'Open 24×7'})[a])).join(', ')} · ${pill('mute','?',t('status checked on approach'))}</div>`:''}
      </div></div>`).join('')}
  </div></div>`}
  <details class="card"><summary>${t('Assumptions')}</summary><ul class="tight">
    <li>Highway consumption ${r0(S.vehicle.cons*consFactor(true))} Wh/km (your ${S.vehicle.cons} Wh/km +15% at highway speed, +7% air-conditioning). The low case adds 20%.</li>

const SUGGEST=['Find a reliable fast charger with food nearby','Can I reach Kukatpally with my battery?','Should I stay or switch at Gachibowli?','How much did I spend on charging?','Plan Hyderabad to Bengaluru','What is my range?'];
const greet = () => `${t("Ask me about chargers, your battery, a trip, or your charging history. I answer only from MyEV data. If I don't have something, I'll say so.")}${(S.lang&&S.lang!=='en'&&!(SRV.on&&['claude','nvidia'].includes(SRV.f.assistant)))?`<div class="small muted" style="margin-top:6px">${t('Detailed replies are in English for now.')}</div>`:''}`;
function askView(){
  if(!S.chat.length) S.chat=[{who:'bot', greet:true}];
  return `<div><span class="eyebrow">${t('AI EV assistant')}</span><h1>${t('Ask MyEV')}</h1></div>
  <div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.who}">${m.greet?greet():m.html}</div>`).join('')}</div>
  <div class="chips ${S.driving?'wrap':'fade'}">${SUGGEST.map(s=>`<button class="chip" data-act="ask" data-q="${esc(s)}" ${S.driving?'style="min-height:52px;font-size:15px"':''}>${esc(t(s))}</button>`).join('')}</div>
  ${S.driving?`<p class="small muted">${t('Typing is off while driving. Use the shortcuts above.')}</p>`:`<form class="composer" id="askform"><input type="text" id="askq" placeholder="${t('e.g. cheapest compatible charger under 3 km')}" autocomplete="off" aria-label="${t('Ask MyEV')}"><button class="btn primary" type="submit">${t('Ask')}</button></form>`}`;

function answer(q){
  const t=q.toLowerCase(); const out=[];
  const mini=e=>`<button class="mini" data-act="open" data-id="${e.st.id}"><b>${esc(e.st.name)}</b><span class="small num">${e.km.toFixed(1)} km · ${e.plug.kw} kW · ${esc(e.av.text)} ${srcTag(e.av)}</span><span class="small muted num">~${mins(e.total)} total · ${e.cost!=null?inr(e.cost):'price n/a'} · arrive ~${r0(e.arr)}%</span></button>`;
  if(/stay|switch/.test(t)){
    const st=ST.find(s=>t.includes(s.area.toLowerCase()))||ST.find(s=>s.id===S.stay.station);
    S.stay.station=st.id;
    return `I've set up the comparison for <b>${esc(st.name)}</b> with ${S.stay.ahead} cars ahead. <button class="btn primary" data-act="tab" data-v="switch" style="margin-top:6px">Open stay or switch</button>`;
  }
  if(/spend|spent|cost me|history|how much did/.test(t)){
    const h=S.history, last30=h.filter(x=>Date.now()-x.at<30*DAY);
    const sum=a=>a.reduce((s,x)=>s+x.cost,0), kw=a=>a.reduce((s,x)=>s+x.kwh,0);
    return `In the last 30 days you saved ${last30.length} sessions: <b>${inr(sum(last30))}</b> for ${kw(last30).toFixed(1)} kWh (avg ₹${(sum(last30)/Math.max(1,kw(last30))).toFixed(1)}/kWh). All-time in MyEV: ${inr(sum(h))} over ${h.length} sessions.`;
  }
  if(/range|battery|how far/.test(t) && !/reach/.test(t)){
    const r=rangeKm();
    return `Battery is <b>${r0(S.soc)}%</b> from ${S.socSource==='manual'?`your manual entry ${ago((Date.now()-S.socTime)/60e3)}`:'your vehicle link'}. Estimated city range ~${r0(r.mid)} km (could be ${r0(r.lo)}–${r0(r.hi)} km). With your ${S.reserve}% reserve kept aside, plan on ~${r0(rangeKm(S.soc-S.reserve).mid)} km.`;
  }
  if(/bengaluru|bangalore|vijayawada|warangal|trip|plan/.test(t)){
    if(S.vehicle.type!=='car'||!S.vehicle.maxDC) return `Highway trip planning is for DC-fast-charging cars for now. For your ${esc(S.vehicle.model)}, use the Chargers tab for city charging.`;
    const k=/vijayawada/.test(t)?'vjw':/warangal/.test(t)?'wgl':'blr'; S.trip.route=k; const P=planTrip(k, S.soc);
    if(P.error) return esc(P.error);
    return `${CORRIDORS[k].name}: about <b>${mins(P.total)}</b> with ${(n=>n+' charging stop'+(n===1?'':'s'))(P.legs.filter(l=>l.type==='stop').length)}, ~${inr(P.cost)} charging. Stops: ${P.legs.filter(l=>l.type==='stop').map(l=>esc(l.name)).join(', ')||'none'}.${P.warn?` <b>Heads up:</b> ${esc(P.warn)}`:''} <button class="btn primary" data-act="tab" data-v="trip" style="margin-top:6px">Open trip plan</button>`;
  }
  if(/reach|get to|make it/.test(t)){
    const place=PLACES.find(p=>t.includes(p.name.split(/[ ,]/)[0].toLowerCase())) || ST.find(s=>t.includes(s.area.toLowerCase()));
    if(!place) return `I don't know that place yet. Try one of: ${PLACES.map(p=>esc(p.name)).join(', ')}.`;
    const fake={...place, plugs:[{type:'CCS2',kw:50,n:1}], status:{src:'none',age:0}, rel:1, amen:[], price:null};
    const e=estimate(fake);
    return `${esc(place.name)} is ~${e.km.toFixed(1)} km away. You'd arrive with about <b>${r0(e.arr)}%</b> (low case ${r0(e.arrLo)}%). ${e.reach==='safe'?'That keeps your reserve.':e.reach==='tight'?'Your reserve could be dipped into in the low case.':'That is below your reserve; charge on the way.'} <span class="muted">Estimate; confidence medium.</span>`;
  }
  // charger search with natural-language filters
  const want={fast:/fast|quick|rapid|dc/.test(t), food:/\b(food|eat|eating|coffee|lunch|dinner|restaurant|snack)/.test(t), rel:/reliab|dependable|working/.test(t), cheap:/cheap|lowest cost|cheapest|budget/.test(t), free:/free now|available|no wait/.test(t), h24:/24|night|late/.test(t), rest:/restroom|toilet|washroom/.test(t)};
  const kmMatch=t.match(/(\d+(?:\.\d+)?)\s*km/);
  if(/charger|charge|station|plug|near/.test(t) || Object.values(want).some(Boolean)){
    let list=rankAll().filter(e=>e.plug && e.reach!=='no');
    if(want.fast){ list=list.filter(e=>e.plug.dc&&e.plug.kw>=50); }
    if(want.food){ list=list.filter(e=>e.st.amen.includes('food')); }
    if(want.rest){ list=list.filter(e=>e.st.amen.includes('restroom')); }
    if(want.h24){ list=list.filter(e=>e.st.amen.includes('24x7')); }
    if(want.rel){ list=list.filter(e=>e.st.rel>=.88 && e.av.tone!=='bad'); }
    if(want.free){ list=list.filter(e=>e.av.tone==='ok'); }
    if(kmMatch){ list=list.filter(e=>e.km<=+kmMatch[1]); }
    if(want.cheap){ list.sort((a,b)=>(a.cost??1e9)-(b.cost??1e9)); }
    if(!list.length) return `No compatible stations match all of that. Try dropping one condition.`;
    const top=list.slice(0,3);
    const note = /route/.test(t) ? '<br><span class="muted small">No route is active, so I searched around your location. Start a trip plan to search along a route.</span>' : '';
    return `Here ${top.length>1?'are the best matches':'is the best match'} for your priorities. ${top[0].caveats.length?`<span class="muted">For ${esc(top[0].st.name)}: ${esc(top[0].caveats[0].toLowerCase())}.</span>`:''}${note}${top.map(mini).join('')}`;
  }
  return `I can help with chargers near you, whether you can reach a place, stay-or-switch decisions, trip plans, your range, and your charging history. I don't have data on that question, and I won't guess.`;
}

function historyBlock(h){
  if(!h.length) return `<p class="small muted">${t("No saved sessions. Save one from a station's page after charging.")}</p>`;
  const sorted=[...h].sort((a,b)=>b.at-a.at);
  const kwh=h.reduce((s,x)=>s+x.kwh,0), cost=h.reduce((s,x)=>s+x.cost,0);
  // weekly-ish buckets: by month
  const by={}; h.forEach(x=>{const d=new Date(x.at); const k=d.toLocaleDateString(locale(),{month:'short'}); (by[k]=by[k]||{k,cost:0,kwh:0,t:d.getFullYear()*12+d.getMonth()}); by[k].cost+=x.cost; by[k].kwh+=x.kwh;});
  const months=Object.values(by).sort((a,b)=>a.t-b.t);
  const mx=Math.max(...months.map(m=>m.cost)); const W=300,H=120,pad=26, bw=Math.min(52,(W-pad*2)/months.length-14);
  const nice=Math.ceil(mx/500)*500;
  const bars=months.map((m,i)=>{const x=pad+i*((W-pad*2)/months.length)+((W-pad*2)/months.length-bw)/2; const hh=m.cost/nice*(H-34); return `<rect x="${x}" y="${H-18-hh}" width="${bw}" height="${hh}" rx="3" fill="var(--accent)"/><text x="${x+bw/2}" y="${H-18-hh-4}" text-anchor="middle">${inr(m.cost)}</text><text x="${x+bw/2}" y="${H-5}" text-anchor="middle">${m.k}</text>`}).join('');
  return `<div class="grid3" style="margin-bottom:10px">
    <div><div class="eyebrow">${t('Sessions')}</div><div class="mono" style="font-size:18px">${h.length}</div></div>
    <div><div class="eyebrow">${t('Energy')}</div><div class="mono" style="font-size:18px">${kwh.toFixed(0)} kWh</div></div>
    <div><div class="eyebrow">${t('Avg rate')}</div><div class="mono" style="font-size:18px">₹${(cost/kwh).toFixed(1)}/kWh</div></div></div>
  <svg class="histchart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Charging spend per month"><line x1="${pad}" x2="${W-pad}" y1="${H-18}" y2="${H-18}" stroke="var(--line)"/>${bars}</svg>
  ${(()=>{ const home=h.filter(x=>/Home/.test(x.station)), pub=h.filter(x=>!/Home/.test(x.station)), k=a=>a.reduce((s,x)=>s+x.kwh,0), c=a=>a.reduce((s,x)=>s+x.cost,0); return k(home)>0&&k(pub)>0 ? `<p class="small muted">${t('Home charging averaged ₹{h}/kWh vs ₹{p}/kWh at public chargers.',{h:(c(home)/k(home)).toFixed(1),p:(c(pub)/k(pub)).toFixed(1)})}</p>` : ''; })()}
  ${sorted.map(x=>`<div class="report"><span>${esc(x.station)}<br><span class="muted small num">${new Date(x.at).toLocaleDateString(locale(),{day:'numeric',month:'short'})} · ${x.kwh.toFixed(1)} kWh · ${mins(x.min)}</span></span><span class="num">${inr(x.cost)}</span></div>`).join('')}`;
}

இது உங்கள் வாகன சுயவிவரம், பேட்டரி உள்ளீடுகள், வரலாறு, அறிக்கைகள், கற்ற விருப்பங்களை அழித்து, ஒருங்கிணைப்புகளைத் துண்டிக்கும்.","Delete everything":"எல்லாவற்றையும் அழி","Keep my data":"என் தரவை வைத்திரு","About this prototype":"இந்த முன்மாதிரி பற்றி","No saved sessions. Save one from a station's page after charging.":"சேமித்த அமர்வுகள் இல்லை. சார்ஜ் செய்த பின் நிலையப் பக்கத்திலிருந்து ஒன்றைச் சேமியுங்கள்.","Sessions":"அமர்வுகள்","Energy":"ஆற்றல்","Avg rate":"சராசரி விலை","Home AC charging averaged ₹8/kWh vs ₹{p}/kWh public DC. Sample sessions are demo data.":"வீட்டு AC சார்ஜிங் சராசரி ₹8/kWh, பொது DC ₹{p}/kWh. மாதிரி அமர்வுகள் டெமோ தரவு.","Choose your language":"உங்கள் மொழியைத் தேர்ந்தெடுங்கள்","You can change this any time in My EV.":"இதை எப்போது வேண்டுமானாலும் என் EV-இல் மாற்றலாம்.","Translations are drafts. Station names and some technical notes stay in English.":"மொழிபெயர்ப்புகள் வரைவுகள். நிலையப் பெயர்களும் சில தொழில்நுட்பக் குறிப்புகளும் ஆங்கிலத்திலேயே இருக்கும்.","Continue":"தொடர்க","Back":"பின்செல்","Step {n} · Vehicle type":"படி {n} · வாகன வகை","What do you ride or drive?":"நீங்கள் எதை ஓட்டுகிறீர்கள்?","This decides which plugs and chargers MyEV shows you.":"MyEV உங்களுக்கு எந்த பிளக்குகளையும் சார்ஜர்களையும் காட்ட வேண்டும் என்பதை இது தீர்மானிக்கிறது.","Skip setup, use a demo {v}":"அமைப்பைத் தவிர்த்து டெமோ {v} பயன்படுத்து","Step {n} · {t} model":"படி {n} · {t} மாடல்","Which model?":"எந்த மாடல்?","Search models":"மாடல்களைத் தேடுங்கள்","All":"அனைத்தும்","No DC":"DC இல்லை","No models match. Try another search or enter yours manually.":"பொருந்தும் மாடல்கள் இல்லை. வேறு தேடல் செய்யுங்கள் அல்லது உங்களுடையதைக் கைமுறையாக உள்ளிடுங்கள்.","Not listed? Enter it manually":"பட்டியலில் இல்லையா? கைமுறையாக உள்ளிடுங்கள்","Set battery, plugs and limits yourself on the next step":"அடுத்த படியில் பேட்டரி, பிளக்குகள், வரம்புகளை நீங்களே அமையுங்கள்","Model year":"மாடல் ஆண்டு","Specs are approximate demo values. Check them on the next step.":"விவரக்குறிப்புகள் தோராயமான டெமோ மதிப்புகள். அடுத்த படியில் சரிபாருங்கள்.","Step {n} · Plugs and limits":"படி {n} · பிளக்குகள் மற்றும் வரம்புகள்","Check your specs":"உங்கள் விவரக்குறிப்புகளைச் சரிபாருங்கள்","Used to mark which chargers fit and how fast they can charge your {v}.":"எந்த சார்ஜர்கள் பொருந்தும், உங்கள் {v}ஐ எவ்வளவு வேகமாக சார்ஜ் செய்ய முடியும் என்பதைக் குறிக்க.","Make":"தயாரிப்பாளர்","Model":"மாடல்","Year":"ஆண்டு","Battery (kWh)":"பேட்டரி (kWh)","Usable (kWh, if known)":"பயன்படுத்தக்கூடியது (kWh, தெரிந்தால்)","Use (Wh/km)":"நுகர்வு (Wh/km)","Max DC (kW, 0 if none)":"அதிகபட்ச DC (kW, இல்லையெனில் 0)","Max AC (kW)":"அதிகபட்ச AC (kW)","Plugs on your {v}":"உங்கள் {v}இன் பிளக்குகள்","Step {n} · Battery":"படி {n} · பேட்டரி","Battery and connection":"பேட்டரி மற்றும் இணைப்பு","Enter what your display shows. You can update it any time from the battery button at the top.":"உங்கள் டிஸ்ப்ளேயில் காட்டுவதை உள்ளிடுங்கள். மேலே உள்ள பேட்டரி பொத்தானிலிருந்து எப்போது வேண்டுமானாலும் புதுப்பிக்கலாம்.","Connect your vehicle (optional)":"உங்கள் வாகனத்தை இணைக்கவும் (விருப்பம்)","Live battery data needs an official link from your vehicle's maker. Not every EV can connect, and none can in this prototype. Manual entry gives you every feature.":"நேரலை பேட்டரி தரவுக்கு உங்கள் வாகன தயாரிப்பாளரின் அதிகாரப்பூர்வ இணைப்பு தேவை. எல்லா EV-களும் இணைய முடியாது, இந்த முன்மாதிரியில் எதுவும் இணையாது. கைமுறை உள்ளீட்டில் எல்லா அம்சங்களும் கிடைக்கும்.","Check for my {v}":"என் {v}க்குச் சரிபார்","No maker link is available for {m} yet. Continue with manual entry.":"{m}க்கு இன்னும் தயாரிப்பாளர் இணைப்பு கிடைக்கவில்லை. கைமுறை உள்ளீட்டுடன் தொடருங்கள்.","Step {n} · Location":"படி {n} · இருப்பிடம்","Where are you?":"நீங்கள் எங்கே இருக்கிறீர்கள்?","Why MyEV asks for location":"MyEV ஏன் இருப்பிடம் கேட்கிறது","To sort chargers by distance and estimate your arrival battery. Location is used only while the app is open. It is never shared with charger networks.":"தூரப்படி சார்ஜர்களை வரிசைப்படுத்தவும், வந்தடையும்போது பேட்டரியை மதிப்பிடவும். செயலி திறந்திருக்கும்போது மட்டுமே இருப்பிடம் பயன்படுத்தப்படும். இது ஒருபோதும் சார்ஜர் நெட்வொர்க்குகளுடன் பகிரப்படாது.","Use my current location":"என் தற்போதைய இருப்பிடத்தைப் பயன்படுத்து","Device location isn't available in this web prototype. Pick a place instead.":"இந்த வலை முன்மாதிரியில் சாதன இருப்பிடம் கிடைக்காது. பதிலாக ஓர் இடத்தைத் தேர்ந்தெடுங்கள்.","Or choose a place":"அல்லது ஓர் இடத்தைத் தேர்ந்தெடுங்கள்","Network feed still unavailable. Showing last known data.":"நெட்வொர்க் ஃபீட் இன்னும் கிடைக்கவில்லை. கடைசியாக அறியப்பட்ட தரவு காட்டப்படுகிறது.","Charger status refreshed":"சார்ஜர் நிலை புதுப்பிக்கப்பட்டது","Thanks. Your report is shown with a timestamp.":"நன்றி. உங்கள் அறிக்கை நேரத்துடன் காட்டப்படுகிறது.","Session saved to your history (estimated values, edit later)":"அமர்வு உங்கள் வரலாற்றில் சேமிக்கப்பட்டது (மதிப்பிடப்பட்ட மதிப்புகள், பின்னர் திருத்துங்கள்)","Learned preferences cleared":"கற்ற விருப்பங்கள் அழிக்கப்பட்டன","All your data was deleted":"உங்கள் எல்லாத் தரவும் அழிக்கப்பட்டது","Couldn't delete your account: {e}":"உங்கள் கணக்கை அழிக்க முடியவில்லை: {e}","car":"கார்","scooter":"ஸ்கூட்டர்","auto":"ஆட்டோ","EV":"EV","Food":"உணவு","Restroom":"கழிவறை","Open 24×7":"24×7 திறந்திருக்கும்","Mall":"மால்","Charged OK":"சார்ஜ் ஆனது","There is a queue":"வரிசை உள்ளது","Charger broken":"சார்ஜர் பழுது","Details wrong":"விவரங்கள் தவறு","Charged successfully":"சார்ஜிங் வெற்றி","Reported a queue":"வரிசை இருப்பதாக அறிக்கையிட்டீர்கள்","Reported charger broken":"சார்ஜர் பழுதென அறிக்கையிட்டீர்கள்","Reported wrong details":"தவறான விவரங்களை அறிக்கையிட்டீர்கள்","Shortest total trip time":"குறைந்த மொத்த பயண நேரம்","Lowest cost":"குறைந்த செலவு","Charger reliability":"சார்ஜர் நம்பகத்தன்மை","Larger battery reserve":"அதிக பேட்டரி ரிசர்வ்","Fewer, faster stops":"குறைவான, விரைவான நிறுத்தங்கள்","Car":"கார்","Two-wheeler":"இருசக்கர வாகனம்","Three-wheeler":"மூன்றுசக்கர வாகனம்","Hatchback, sedan or SUV":"ஹேட்ச்பேக், செடான் அல்லது SUV","Electric scooter or motorcycle":"மின்சார ஸ்கூட்டர் அல்லது மோட்டார்சைக்கிள்","Auto-rickshaw or cargo 3W":"ஆட்டோ-ரிக்ஷா அல்லது சரக்கு மூன்றுசக்கரம்","Find a reliable fast charger with food nearby":"அருகில் உணவுடன் நம்பகமான விரைவு சார்ஜரைக் கண்டுபிடி","Can I reach Kukatpally with my battery?":"என் பேட்டரியுடன் குகட்பல்லியை அடைய முடியுமா?","Should I stay or switch at Gachibowli?":"கச்சிபௌலியில் இருக்கவா மாறவா?","How much did I spend on charging?":"சார்ஜிங்கிற்கு எவ்வளவு செலவு செய்தேன்?","Plan Hyderabad to Bengaluru":"ஹைதராபாத்திலிருந்து பெங்களூரு திட்டமிடு","What is my range?":"என் ரேஞ்ச் எவ்வளவு?","Start using MyEV":"MyEV-ஐப் பயன்படுத்தத் தொடங்குங்கள்","Open Charge Map listing":"Open Charge Map பட்டியல்","Route with traffic":"போக்குவரத்துடன் வழி","Not enough data yet":"இன்னும் போதுமான தரவு இல்லை","Couldn't load chargers. Showing the last list.":"சார்ஜர்களை ஏற்ற முடியவில்லை. கடைசி பட்டியல் காட்டப்படுகிறது.","Thinking…":"யோசிக்கிறது…","The assistant couldn't answer: {e}":"உதவியாளரால் பதில் தர முடியவில்லை: {e}","Leg to {n} dips below your reserve: pessimistic arrival {p}%.":"{n} வரையிலான பகுதி உங்கள் ரிசர்வுக்குக் கீழே செல்கிறது: மோசமான நிலையில் {p}% உடன் அடைவீர்கள்.","Not enough battery to reach {n}. Charge before leaving.":"{n} அடைய பேட்டரி போதாது. புறப்படுவதற்கு முன் சார்ஜ் செய்யுங்கள்.","Charge with confidence":"நம்பிக்கையுடன் சார்ஜ் செய்யுங்கள்","Honest estimates for chargers, waits and trips, with the reasoning shown.":"சார்ஜர்கள், காத்திருப்பு, பயணங்களுக்கான நேர்மையான மதிப்பீடுகள், காரணங்களுடன்.","Find chargers that fit your EV":"உங்கள் EV-க்குப் பொருந்தும் சார்ஜர்களைக் கண்டறியுங்கள்","Stay or switch: wait here or try another charger":"இருக்கவா மாறவா: இங்கே காத்திருங்கள் அல்லது வேறு சார்ஜரை முயலுங்கள்","Plan highway trips with charging stops":"சார்ஜிங் நிறுத்தங்களுடன் நெடுஞ்சாலைப் பயணத்தைத் திட்டமிடுங்கள்","Get started":"தொடங்குங்கள்","Explore without an account":"கணக்கு இல்லாமல் பாருங்கள்","{u} kWh usable · approximate specs, edit to match your vehicle":"{u} kWh பயன்படுத்தத்தக்கது · தோராய விவரங்கள், உங்கள் வாகனத்துக்கு ஏற்ப திருத்துங்கள்","Live battery data needs an official link from your vehicle's maker. In India that means direct partnerships with makers such as Tata, MG, Mahindra or Hyundai. No manufacturer link is available yet.":"நேரலை பேட்டரி தரவுக்கு உங்கள் வாகன தயாரிப்பாளரின் அதிகாரப்பூர்வ இணைப்பு தேவை. இந்தியாவில் இதன் பொருள் Tata, MG, Mahindra அல்லது Hyundai போன்ற தயாரிப்பாளர்களுடன் நேரடி கூட்டாண்மை. தயாரிப்பாளர் இணைப்பு எதுவும் இன்னும் கிடைக்கவில்லை.","Not available yet for {m}. Manual entry works fully. When a maker link exists, MyEV will ask only for battery level and charging state, and you can disconnect here at any time.":"{m}க்கு இன்னும் கிடைக்கவில்லை. கைமுறை உள்ளீடு முழுமையாக வேலை செய்யும். தயாரிப்பாளர் இணைப்பு வந்தால் MyEV பேட்டரி அளவையும் சார்ஜிங் நிலையையும் மட்டுமே கேட்கும், நீங்கள் எப்போது வேண்டுமானாலும் இங்கே துண்டிக்கலாம்.","Turns off typing and enlarges controls.":"தட்டச்சை அணைத்து பொத்தான்களைப் பெரிதாக்கும்.","Where your data comes from":"உங்கள் தரவு எங்கிருந்து வருகிறது","Charger status":"சார்ஜர் நிலை","Prices":"விலைகள்","Routing":"வழித்தடம்","Weather":"வானிலை","Location":"இருப்பிடம்","Shown with its source and how old it is. Driver reports are kept separate from live status.":"மூலமும் அது எவ்வளவு பழையது என்பதும் காட்டப்படும். ஓட்டுநர் அறிக்கைகள் நேரலை நிலையிலிருந்து தனியாக வைக்கப்படும்.","Network or listing prices where published, otherwise marked not published.":"வெளியிடப்பட்டிருந்தால் நெட்வொர்க் அல்லது பட்டியல் விலைகள், இல்லையெனில் “வெளியிடப்படவில்லை” எனக் காட்டப்படும்.","Distances and drive times are estimates, not live traffic.":"தூரமும் பயண நேரமும் மதிப்பீடுகள் மட்டுமே, நேரலை போக்குவரத்து அல்ல.","The current temperature adjusts the range estimate for air conditioning.":"தற்போதைய வெப்பநிலைக்கு ஏற்ப ஏசிக்கான ரேஞ்ச் மதிப்பீடு மாறும்.","{n}. Device location is used only while the app is open, to sort nearby chargers.":"{n}. சாதன இருப்பிடம் செயலி திறந்திருக்கும்போது மட்டுமே, அருகிலுள்ள சார்ஜர்களை வரிசைப்படுத்தப் பயன்படுத்தப்படும்.","Home charging averaged ₹{h}/kWh vs ₹{p}/kWh at public chargers.":"வீட்டு சார்ஜிங் சராசரி ₹{h}/kWh, பொது சார்ஜர்களில் ₹{p}/kWh.","No places found. Try a nearby area name.":"இடங்கள் கிடைக்கவில்லை. அருகிலுள்ள பகுதியின் பெயரை முயலுங்கள்.","(estimate)":"(மதிப்பீடு)","Range comes from {km} km estimated distance (straight line × 1.35), {c} Wh/km for your {v}":"ரேஞ்ச் {km} கி.மீ மதிப்பிடப்பட்ட தூரம் (நேர்கோடு × 1.35), உங்கள் {v}க்கு {c} Wh/km அடிப்படையில் வருகிறது",", +7% for air-conditioning at {T} °C (current weather)":", {T} °C வெப்பநிலையில் ஏசிக்கு +7% (தற்போதைய வானிலை)",". The low end assumes 20% higher use for traffic, climbs and driving style.":". குறைந்த மதிப்பீடு போக்குவரத்து, ஏற்றம், ஓட்டும் முறைக்காக 20% கூடுதல் பயன்பாட்டைக் கருதுகிறது.","{p}% of logged sessions succeeded":"பதிவான அமர்வுகளில் {p}% வெற்றி","Sample listing":"மாதிரிப் பட்டியல்","Network tariff":"நெட்வொர்க் கட்டணம்","Drive times are straight-line estimates, not live traffic. Alternatives use the same generic charging curve.":"பயண நேரங்கள் நேர்கோடு அடிப்படையிலான மதிப்பீடுகள், நேரலை போக்குவரத்து அல்ல. மாற்றுகளுக்கும் அதே பொதுவான சார்ஜிங் வளைவு பயன்படுத்தப்படும்.","Highway trip planning is for DC-fast-charging cars for now. Two- and three-wheelers can't use the NH corridor chargers (CCS2 only) and expressway rules vary.":"தற்போதைக்கு நெடுஞ்சாலை பயணத் திட்டம் DC விரைவு சார்ஜிங் கார்களுக்கு மட்டும். இருசக்கர, மூன்றுசக்கர வாகனங்கள் NH வழித்தட சார்ஜர்களை (CCS2 மட்டும்) பயன்படுத்த முடியாது, விரைவுச்சாலை விதிகள் வேறுபடும்.","Drive ~{d} at {s} km/h average (estimate, not live traffic) + ~{c} charging incl. 5 min per stop to plug in.":"சராசரியாக {s} கி.மீ/மணி வேகத்தில் ~{d} பயணம் (மதிப்பீடு, நேரலை போக்குவரத்து அல்ல) + ~{c} சார்ஜிங், ஒவ்வொரு நிறுத்தத்திலும் பிளக் செய்ய 5 நிமிடம் உட்பட.","Station prices and reliability are estimates. Live status is checked when you get within 30 min of a stop.":"நிலைய விலைகளும் நம்பகத்தன்மையும் மதிப்பீடுகள் மட்டுமே. ஒரு நிறுத்தத்திலிருந்து 30 நிமிடத்துக்குள் வந்ததும் நேரலை நிலை சரிபார்க்கப்படும்.","Hills are not modelled; real use can differ.":"மேடு பள்ளங்கள் கணக்கில் எடுக்கப்படவில்லை; உண்மையான பயன்பாடு வேறுபடலாம்.","Skip setup (you can change your vehicle later)":"அமைப்பைத் தவிர்க்கவும் (வாகனத்தைப் பின்னர் மாற்றலாம்)","Specs are approximate. Check them on the next step.":"விவரக்குறிப்புகள் தோராயமானவை. அடுத்த படியில் சரிபாருங்கள்.","Live battery data needs an official link from your vehicle's maker. Not every EV can connect yet. Manual entry gives you every feature.":"நேரலை பேட்டரி தரவுக்கு உங்கள் வாகன தயாரிப்பாளரின் அதிகாரப்பூர்வ இணைப்பு தேவை. எல்லா EV-களும் இன்னும் இணைய முடியாது. கைமுறை உள்ளீட்டில் எல்லா அம்சங்களும் கிடைக்கும்.","Location isn't available in this browser. Pick a place instead.":"இந்த உலாவியில் இருப்பிடம் கிடைக்கவில்லை. அதற்குப் பதிலாக ஓர் இடத்தைத் தேர்ந்தெடுங்கள்.","Detailed replies are in English for now.":"விரிவான பதில்கள் தற்போதைக்கு ஆங்கிலத்தில் இருக்கும்.","Reset password":"கடவுச்சொல்லை மீட்டமைக்கவும்","We'll email you a reset link.":"மீட்டமைப்பு இணைப்பை மின்னஞ்சலில் அனுப்புவோம்.","Email address":"மின்னஞ்சல் முகவரி","We can't send reset emails right now. Please try again later.":"இப்போது மீட்டமைப்பு மின்னஞ்சல்களை அனுப்ப முடியவில்லை. பிறகு மீண்டும் முயற்சிக்கவும்.","If an account exists for {e}, a reset link is on its way.":"{e} க்கு கணக்கு இருந்தால், மீட்டமைப்பு இணைப்பு அனுப்பப்படுகிறது.","Send reset link":"மீட்டமைப்பு இணைப்பை அனுப்பு","Back to sign in":"உள்நுழைவுக்குத் திரும்பு","Create account":"கணக்கை உருவாக்கு","Set up MyEV in under a minute.":"ஒரு நிமிடத்திற்குள் MyEV ஐ அமைக்கவும்.","Name":"பெயர்","Your name":"உங்கள் பெயர்","Password":"கடவுச்சொல்","At least 8 characters":"குறைந்தது 8 எழுத்துகள்","Create a password":"கடவுச்சொல்லை உருவாக்கவும்","Already have an account?":"ஏற்கனவே கணக்கு உள்ளதா?","Welcome!":"வரவேற்கிறோம்!","Your next charge starts here.":"உங்கள் அடுத்த சார்ஜ் இங்கே தொடங்குகிறது.","Your password":"உங்கள் கடவுச்சொல்","Forgot password?":"கடவுச்சொல்லை மறந்துவிட்டீர்களா?","New to MyEV?":"MyEV க்கு புதியவரா?","or continue with":"அல
