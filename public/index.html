rve in low case":"ಕೆಟ್ಟ ಸಂದರ್ಭದಲ್ಲಿ ರಿಸರ್ವ್‌ಗಿಂತ ಕಡಿಮೆ","Charge to {p}%":"{p}% ವರೆಗೆ ಚಾರ್ಜ್ ಮಾಡಿ","{p}% reliability":"{p}% ವಿಶ್ವಾಸಾರ್ಹತೆ","status checked on approach":"ಹತ್ತಿರ ಬಂದಾಗ ಸ್ಥಿತಿ ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ","Ask me about chargers, your battery, a trip, or your charging history. I answer only from MyEV data. If I don't have something, I'll say so.":"ಚಾರ್ಜರ್‌ಗಳು, ನಿಮ್ಮ ಬ್ಯಾಟರಿ, ಪ್ರಯಾಣ ಅಥವಾ ಚಾರ್ಜಿಂಗ್ ಇತಿಹಾಸದ ಬಗ್ಗೆ ಕೇಳಿ. ನಾನು MyEV ಡೇಟಾದಿಂದ ಮಾತ್ರ ಉತ್ತರಿಸುತ್ತೇನೆ. ಮಾಹಿತಿ ಇಲ್ಲದಿದ್ದರೆ ಹಾಗೆಯೇ ಹೇಳುತ್ತೇನೆ.","In this prototype, detailed replies are in English. The production assistant replies in your language.":"ಈ ಮಾದರಿಯಲ್ಲಿ ವಿವರವಾದ ಉತ್ತರಗಳು ಇಂಗ್ಲಿಷ್‌ನಲ್ಲಿವೆ. ನಿಜವಾದ ಸಹಾಯಕ ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಉತ್ತರಿಸುತ್ತದೆ.","AI EV assistant":"AI EV ಸಹಾಯಕ","Ask MyEV":"MyEV ಅನ್ನು ಕೇಳಿ","Typing is off while driving. Use the shortcuts above.":"ಚಾಲನೆಯ ವೇಳೆ ಟೈಪಿಂಗ್ ಆಫ್ ಆಗಿದೆ. ಮೇಲಿನ ಶಾರ್ಟ್‌ಕಟ್‌ಗಳನ್ನು ಬಳಸಿ.","e.g. cheapest compatible charger under 3 km":"ಉದಾ. 3 km ಒಳಗೆ ಅಗ್ಗದ ಹೊಂದುವ ಚಾರ್ಜರ್","Ask":"ಕೇಳಿ","{u} kWh usable · demo specs, edit to match your vehicle":"{u} kWh ಬಳಸಬಹುದಾದ್ದು · ಡೆಮೊ ವಿವರಗಳು, ನಿಮ್ಮ ವಾಹನಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಿಸಿ","Account":"ಖಾತೆ","Guest: data stays on this device":"ಅತಿಥಿ: ಡೇಟಾ ಈ ಸಾಧನದಲ್ಲೇ ಇರುತ್ತದೆ","Signed in as {n}":"{n} ಆಗಿ ಸೈನ್ ಇನ್ ಆಗಿದ್ದೀರಿ","Sign in":"ಸೈನ್ ಇನ್","Sign out":"ಸೈನ್ ಔಟ್","Language":"ಭಾಷೆ","Change":"ಬದಲಿಸಿ","Battery":"ಬ್ಯಾಟರಿ","Battery now:":"ಈಗಿನ ಬ್ಯಾಟರಿ:","Source: manual entry, {t}. Update it from your display.":"ಮೂಲ: ಕೈಯಾರೆ ನಮೂದು, {t}. ನಿಮ್ಮ ಡಿಸ್‌ಪ್ಲೇ ನೋಡಿ ಅಪ್‌ಡೇಟ್ ಮಾಡಿ.","Source: vehicle link":"ಮೂಲ: ವಾಹನ ಲಿಂಕ್","Vehicle connection":"ವಾಹನ ಸಂಪರ್ಕ","Live battery data needs an official link from your vehicle's maker. In India that means direct partnerships with makers such as Tata, MG, Mahindra or Hyundai. None are connected in this prototype.":"ಲೈವ್ ಬ್ಯಾಟರಿ ಡೇಟಾಗೆ ನಿಮ್ಮ ವಾಹನ ತಯಾರಕರ ಅಧಿಕೃತ ಲಿಂಕ್ ಬೇಕು. ಭಾರತದಲ್ಲಿ ಇದರರ್ಥ Tata, MG, Mahindra ಅಥವಾ Hyundai ಯಂತಹ ತಯಾರಕರೊಂದಿಗೆ ನೇರ ಪಾಲುದಾರಿಕೆ. ಈ ಮಾದರಿಯಲ್ಲಿ ಯಾವುದೂ ಸಂಪರ್ಕಗೊಂಡಿಲ್ಲ.","Connect my vehicle":"ನನ್ನ ವಾಹನ ಸಂಪರ್ಕಿಸಿ","Not available )":"ಗರಿಷ್ಠ AC (kW)","Plugs on your {v}":"ನಿಮ್ಮ {v}ನ ಪ್ಲಗ್‌ಗಳು","Step {n} · Battery":"ಹಂತ {n} · ಬ್ಯಾಟರಿ","Battery and connection":"ಬ್ಯಾಟರಿ ಮತ್ತು ಸಂಪರ್ಕ","Enter what your display shows. You can update it any time from the battery button at the top.":"ನಿಮ್ಮ ಡಿಸ್‌ಪ್ಲೇಯಲ್ಲಿ ಕಾಣುವುದನ್ನು ನಮೂದಿಸಿ. ಮೇಲಿನ ಬ್ಯಾಟರಿ ಬಟನ್‌ನಿಂದ ಯಾವಾಗ ಬೇಕಾದರೂ ಅಪ್‌ಡೇಟ್ ಮಾಡಬಹುದು.","Connect your vehicle (optional)":"ನಿಮ್ಮ ವಾಹನ ಸಂಪರ್ಕಿಸಿ (ಐಚ್ಛಿಕ)","Live battery data needs an official link from your vehicle's maker. Not every EV can connect, and none can in this prototype. Manual entry gives you every feature.":"ಲೈವ್ ಬ್ಯಾಟರಿ ಡೇಟಾಗೆ ನಿಮ್ಮ ವಾಹನ ತಯಾರಕರ ಅಧಿಕೃತ ಲಿಂಕ್ ಬೇಕು. ಪ್ರತಿ EV ಸಂಪರ್ಕಿಸಲಾಗದು, ಈ ಮಾದರಿಯಲ್ಲಿ ಯಾವುದೂ ಆಗದು. ಕೈಯಾರೆ ನಮೂದಿನಲ್ಲಿ ಎಲ್ಲಾ ವೈಶಿಷ್ಟ್ಯಗಳೂ ಸಿಗುತ್ತವೆ.","Check for my {v}":"ನನ್ನ {v}ಗೆ ಪರಿಶೀಲಿಸಿ","No maker link is available for {m} yet. Continue with manual entry.":"{m}ಗೆ ಇನ್ನೂ ತಯಾರಕರ ಲಿಂಕ್ ಲಭ್ಯವಿಲ್ಲ. ಕೈಯಾರೆ ನಮೂದಿನೊಂದಿಗೆ ಮುಂದುವರಿಸಿ.","Step {n} · Location":"ಹಂತ {n} · ಸ್ಥಳ","Where are you?":"ನೀವು ಎಲ್ಲಿದ್ದೀರಿ?","Why MyEV asks for location":"MyEV ಸ್ಥಳ ಏಕೆ ಕೇಳುತ್ತದೆ","To sort chargers by distance and estimate your arrival battery. Location is used only while the app is open. It is never shared with charger networks.":"ದೂರದ ಪ್ರಕಾರ ಚಾರ್ಜರ್‌ಗಳನ್ನು ವಿಂಗಡಿಸಲು ಮತ್ತು ತಲುಪುವಾಗಿನ ಬ್ಯಾಟರಿ ಅಂದಾಜಿಸಲು. ಆ್ಯಪ್ ತೆರೆದಿರುವಾಗ ಮಾತ್ರ ಸ್ಥಳ ಬಳಸಲಾಗುತ್ತದೆ. ಇದನ್ನು ಎಂದಿಗೂ ಚಾರ್ಜರ್ ನೆಟ್‌ವರ್ಕ್‌ಗಳೊಂದಿಗೆ ಹಂಚಿಕೊಳ್ಳುವುದಿಲ್ಲ.","Use my current location":"ನನ್ನ ಈಗಿನ ಸ್ಥಳ ಬಳಸಿ","Device location isn't available in this web prototype. Pick a place instead.":"ಈ ವೆಬ್ ಮಾದರಿಯಲ್ಲಿ ಸಾಧನದ ಸ್ಥಳ ಲಭ್ಯವಿಲ್ಲ. ಬದಲಿಗೆ ಒಂದು ಸ್ಥಳ ಆರಿಸಿ.","Or choose a place":"ಅಥವಾ ಒಂದು ಸ್ಥಳ ಆರಿಸಿ","Network feed still unavailable. Showing last known data.":"ನೆಟ್‌ವರ್ಕ್ ಫೀಡ್ ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ. ಕೊನೆಯದಾಗಿ ತಿಳಿದ ಡೇಟಾ ತೋರಿಸಲಾಗುತ್ತಿದೆ.","Charger status refreshed":"ಚಾರ್ಜರ್ ಸ್ಥಿತಿ ರಿಫ್ರೆಶ್ ಆಯಿತು","Thanks. Your report is shown with a timestamp.":"ಧನ್ಯವಾದ. ನಿಮ್ಮ ವರದಿ ಸಮಯದೊಂದಿಗೆ ತೋರಿಸಲಾಗಿದೆ.","Session saved to your history (estimated values, edit later)":"ಸೆಷನ್ ನಿಮ್ಮ ಇತಿಹಾಸದಲ್ಲಿ ಉಳಿಸಲಾಗ ಲಿಲ್ಲ: {e}","Leg to {n} dips below your reserve: pessimistic arrival {p}%.":"{n} ವರೆಗಿನ ಭಾಗ ನಿಮ್ಮ ರಿಸರ್ವ್‌ಗಿಂತ ಕೆಳಗೆ ಹೋಗುತ್ತದೆ: ಕೆಟ್ಟ ಸಂದರ್ಭದಲ್ಲಿ {p}% ನೊಂದಿಗೆ ತಲುಪುತ್ತೀರಿ.","Not enough battery to reach {n}. Charge before leaving.":"{n} ತಲುಪಲು ಬ್ಯಾಟರಿ ಸಾಕಾಗುವುದಿಲ್ಲ. ಹೊರಡುವ ಮೊದಲು ಚಾರ್ಜ್ ಮಾಡಿ.","Charge with confidence":"ವಿಶ್ವಾಸದಿಂದ ಚಾರ್ಜ್ ಮಾಡಿ","Honest estimates for chargers, waits and trips, with the reasoning shown.":"ಚಾರ್ಜರ್, ಕಾಯುವಿಕೆ ಮತ್ತು ಪ್ರಯಾಣಗಳ ಪ್ರಾಮಾಣಿಕ ಅಂದಾಜುಗಳು, ಕಾರಣಗಳೊಂದಿಗೆ.","Find chargers that fit your EV":"ನಿಮ್ಮ EVಗೆ ಹೊಂದುವ ಚಾರ್ಜರ್‌ಗಳನ್ನು ಹುಡುಕಿ","Stay or switch: wait here or try another charger":"ಇರಬೇಕೇ ಬದಲಿಸಬೇಕೇ: ಇಲ್ಲೇ ಕಾಯಿರಿ ಅಥವಾ ಬೇರೆ ಚಾರ್ಜರ್ ಪ್ರಯತ್ನಿಸಿ","Plan highway trips with charging stops":"ಚಾರ್ಜಿಂಗ್ ನಿಲುಗಡೆಗಳೊಂದಿಗೆ ಹೆದ್ದಾರಿ ಪ್ರಯಾಣ ಯೋಜಿಸಿ","Get started":"ಪ್ರಾರಂಭಿಸಿ","Explore without an account":"ಖಾತೆ ಇಲ್ಲದೆ ನೋಡಿ","{u} kWh usable · approximate specs, edit to match your vehicle":"{u} kWh ಬಳಸಬಹುದಾದ · ಅಂದಾಜು ವಿವರಗಳು, ನಿಮ್ಮ ವಾಹನಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಿಸಿ","Live battery data needs an official link from your vehicle's maker. In India that means direct partnerships with makers such as Tata, MG, Mahindra or Hyundai. No manufacturer link is available yet.":"ಲೈವ್ ಬ್ಯಾಟರಿ ಡೇಟಾಗೆ ನಿಮ್ಮ ವಾಹನ ತಯಾರಕರ ಅಧಿಕೃತ ಲಿಂಕ್ ಬೇಕು. ಭಾರತದಲ್ಲಿ ಇದರರ್ಥ Tata, MG, Mahindra ಅಥವಾ Hyundai ಯಂತಹ ತಯಾರಕರೊಂದಿಗೆ ನೇರ ಪಾಲುದಾರಿಕೆ. ತಯಾರಕರ ಲಿಂಕ್ ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ.","Not available yet for {m}. Manual entry works fully. When a maker link exists, MyEV will ask only for battery level and charging state, and you can disconnect here at any time.":"{m}ಗೆ ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ. ಕೈಯಾರೆ ನಮೂದು ಪೂರ್ಣವಾಗಿ ಕೆಲಸ ಮಾಡುತ್ತದೆ. ತಯಾರಕರ ಲಿಂಕ್ ಬಂದಾಗ MyEV ಬ್ಯಾಟರಿ ಮಟ್ಟ ಮತ್ತು ಚಾರ್ಜಿಂಗ್ ಸ್ಥಿತಿಯನ್ನು ಮಾತ್ರ ಕೇಳುತ್ತದೆ, ನೀವು ಯಾವಾಗ ಬೇಕಾದರೂ ಇಲ್ಲಿ ಸಂಪರ್ಕ ಕಡಿತಗೊಳಿಸಬಹುದು.","Turns off typing and enlarges controls.":"ಟೈಪಿಂಗ್ ಆಫ್ ಮಾಡಿ ಬಟನ್‌ಗಳನ್ನು ದೊಡ್ಡದಾಗಿಸುತ್ತದೆ.","Where your data comes from":"ನಿಮ್ಮ ಡೇಟಾ ಎಲ್ಲಿಂದ ಬರುತ್ತದೆ","Charger status":"ಚಾರ್ಜರ್ ಸ್ಥಿತಿ","Prices":"ಬೆಲೆಗಳು","Routing":"ಮಾರ್ಗ","Weather":"ಹವಾಮಾನ","Location":"ಸ್ಥಳ","Shown with its source and how old it is. Driver reports are kept separate from live status.":"ಮೂಲ ಮತ್ತು ಅದು ಎಷ್ಟು ಹಳೆಯದು ಎಂಬುದನ್ನು ತೋರಿಸಲಾಗುತ್ತದೆ. ಚಾಲಕರ ವರದಿಗಳನ್ನು ಲೈವ್ ಸ್ಥಿತಿಯಿಂದ ಪ್ರತ್ಯೇಕವಾಗಿಡಲಾಗುತ್ತದೆ.","Network or listing prices where published, otherwise marked not published.":"ಪ್ರಕಟಿಸಿದಲ್ಲಿ ನೆಟ್‌ವರ್ಕ್ ಅಥವಾ ಪಟ್ಟಿಯ ಬೆಲೆಗಳು, ಇಲ್ಲದಿದ್ದರೆ “ಪ್ರಕಟಿಸಿಲ್ಲ” ಎಂದು ತೋರಿಸಲಾಗುತ್ತದೆ.","Distances and drive times are estimates, not live traffic.":"ದೂರ ಮತ್ತು ಡ್ರೈವ್ ಸಮಯಗಳು ಅಂದಾಜುಗಳು ಮಾತ್ರ, ಲೈವ್ ಟ್ರಾಫಿಕ್ ಅಲ್ಲ.","The current temperature adjusts the range estimate for air conditioning.":"ಪ್ರಸ್ತುತ ತಾಪಮಾನಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಎಸಿಗಾಗಿ ರೇಂಜ್ ಅಂದಾಜು ಬದಲಾಗುತ್ತದೆ.","{n}. Device location is used only while the app is open, to sort nearby chargers.":"{n}. ಸಾಧನದ ಸ್ಥಳವನ್ನು ಆ್ಯಪ್ ತೆರೆದಿರುವಾಗ ಮಾತ್ರ, ಹತ್ತಿರದ ಚಾರ್ಜರ್‌ಗಳನ್ನು ವಿಂಗಡಿಸಲು ಬಳಸಲಾಗುತ್ತದೆ.","Home charging averaged ₹{h}/kWh vs ₹{p}/kWh at public chargers.":"ಮನೆಯ ಚಾರ್ಜಿಂಗ್ ಸರಾಸರಿ ₹{h}/kWh, ಸಾರ್ವಜನಿಕ ಚಾರ್ಜರ್‌ಗಳಲ್ಲಿ ₹{p}/kWh.","No places found. Try a nearby area name.":"ಯಾವುದೇ ಸ್ಥಳ ಸಿಗಲಿಲ್ಲ. ಹತ್ತಿರದ ಪ್ರದೇಶದ ಹೆಸರನ್ನು ಪ್ರಯತ್ನಿಸಿ.","(estimate)":"(ಅಂದಾಜು)","Range comes from {km} km estimated distance (straight line × 1.35), {c} Wh/km for your {v}":"ರೇಂಜ್ {km} ಕಿ.ಮೀ ಅಂದಾಜು ದೂರ (ನೇರ ಗೆರೆ × 1.35), ನಿಮ್ಮ {v}ಗೆ {c} Wh/km ಆಧಾರದ ಮೇಲೆ ಬಂದಿದೆ",", +7% for air-conditioning at {T} °C (current weather)":", {T} °C ನಲ್ಲಿ ಎಸಿಗೆ +7% (ಪ್ರಸ್ತುತ ಹವಾಮಾನ)",". The low end assumes 20% higher use for traffic, climbs and driving style.":". ಕಡಿಮೆ ಅಂದಾಜು ಟ್ರಾಫಿಕ್, ಏರುಗಳು ಮತ್ತು ಚಾಲನಾ ಶೈಲಿಗಾಗಿ 20% ಹೆಚ್ಚು ಬಳಕೆಯನ್ನು ಊಹಿಸುತ್ತದೆ.","{p}% of logged sessions succeeded":"ದಾಖಲಾದ ಸೆಷನ್‌ಗಳಲ್ಲಿ {p}% ಯಶಸ್ವಿ","Sample listing":"ಮಾದರಿ ಪಟ್ಟಿ","Network tariff":"ನೆಟ್‌ವರ್ಕ್ ದರ","Drive times are straight-line estimates, not live traffic. Alternatives use the same generic charging curve.":"ಡ್ರೈವ್ ಸಮಯಗಳು ನೇರ ಗೆರೆ ಆಧಾರಿತ ಅಂದಾಜುಗಳು, ಲೈವ್ ಟ್ರಾಫಿಕ್ ಅಲ್ಲ. ಪರ್ಯಾಯಗಳಿಗೂ ಅದೇ ಸಾಮಾನ್ಯ ಚಾರ್ಜಿಂಗ್ ಕರ್ವ್ ಬಳಸಲಾಗುತ್ತದೆ.","Highway trip planning is for DC-fast-charging cars for now. Two- and three-wheelers can't use the NH corridor chargers ( const MISSING = new Set();
function t(src, vars){
  const L = S.lang && S.lang!=='en' ? I18N[S.lang] : null;
  let out = src;
  if(L){ if(L[src]!=null) out = L[src]; else MISSING.add(src); }
  if(vars) out = out.replace(/\{(\w+)\}/g, (m,k)=> vars[k]!=null ? vars[k] : m);
  return out;
}
function locale(){ return (LANGS.find(l=>l.code===(S.lang||'en'))||LANGS[0]).locale; }
function langView(){
  const cur = S.langPick || S.lang || 'en';
  const prev = S.lang; S.lang = cur;               // preview the screen in the highlighted language
  const html = `<div class="onb">
    <span class="eyebrow">${t('Language')}</span>
    <h1>${t('Choose your language')}</h1>
    <p class="small muted">${t('You can change this any time in My EV.')}</p>
    <div class="lang-list" role="radiogroup" aria-label="${t('Language')}">
      ${LANGS.map(l=>`<button class="lang-opt" role="radio" aria-checked="${l.code===cur}" aria-pressed="${l.code===cur}" data-act="picklang" data-c="${l.code}" lang="${l.code}">
        <span class="lang-glyph" aria-hidden="true">${l.glyph}</span>
        <span><b>${l.native}</b><br><span class="small muted" lang="en">${l.en}</span></span><span class="tick">✓</span></button>`).join('')}
    </div>
    ${cur!=='en'?`<p class="small muted">${t('Translations are drafts. Station names and some technical notes stay in English.')}</p>`:''}
    <div class="stack bar"><button class="btn primary big" data-act="confirmlang">${t('Continue')}</button></div>
  </div>`;
  S.lang = prev;
  return html;
}

/* ---------- ONBOARDING ---------- */

    <div class="models">${Object.entries(groups).map(([b,vs])=>`<div class="brandgroup">${esc(b)}</div>${vs.map(v=>`<button class="model" data-act="pickveh" data-i="${v.i}" aria-pressed="${S.vehicle.idx===v.i}">
        <b>${esc(v.model)}</b><span class="small muted num">${v.usable} kWh</span>
        <span class="specs">${v.connectors.map(c=>`<span class="spec">${CONN[c].label}</span>`).join('')}<span class="spec">${v.maxDC?`DC ${v.maxDC} kW`:t('No DC')}</span><span class="spec">${v.cons} Wh/km</span></span></button>`).join('')}`).join('') || `<p class="small muted">${t('No models match. Try another search or enter yours manually.')}</p>`}
      <button class="model" data-act="pickveh" data-i="-1" aria-pressed="${S.vehicle.idx===-1}"><b>${t('Not listed? Enter it manually')}</b><span></span><span class="specs"><span class="small muted">${t('Set battery, plugs and limits yourself on the next step')}</span></span></button>
    </div>
    ${picked||S.vehicle.idx===-1?`<label class="field">${t('Model year')}<select id="vyear">${[2027,2026,2025,2024,2023,2022,2021,2020].map(y=>`<option ${S.vehicle.year===y?'selected':''}>${y}</option>`).join('')}</select></label>`:''}
    <p class="small muted">${t('Specs are approximate. Check them on the next step.')}</p>

  }
  if(s===3){ const v=S.vehicle; return `<div class="onb">${dots}<span class="eyebrow">${t('Step {n} · Plugs and limits',{n:3})}</span><h1>${t('Check your specs')}</h1><p class="small muted">${t('Used to mark which chargers fit and how fast they can charge your {v}.',{v:vword()})}</p>
    <div class="grid2"><label class="field">${t('Make')}<input type="text" id="v_make" value="${esc(v.make)}"></label><label class="field">${t('Model')}<input type="text" id="v_model" value="${esc(v.model)}"></label>

    <label class="field">${t('Usable (kWh, if known)')}<input type="number" id="v_usable" value="${v.usable}" step="0.1"></label><label class="field">${t('Use (Wh/km)')}<input type="number" id="v_cons" value="${v.cons}"></label>
    <label class="field">${t('Max DC (kW, 0 if none)')}<input type="number" id="v_maxDC" value="${v.maxDC}" step="0.1"></label><label class="field">${t('Max AC (kW)')}<input type="number" id="v_maxAC" value="${v.maxAC}" step="0.1"></label></div>
    <div class="eyebrow">${t('Plugs on your {v}',{v:vword()})}</div>
    <div class="checks">${Object.entries(CONN).map(([k,c])=>`<label><input type="checkbox" class="v_conn" value="${k}" ${v.connectors.includes(k)?'checked':''}>${c.label}</label>`).join('')}</div>${nav()}</div>`; }
  if(s===4) return `<div class="onb">${dots}<span class="eyebrow">${t('Step {n} · Battery',{n:4})}</span><h1>${t('Battery and connection')}</h1>
    <label class="field">${t('Battery now:')} <span class="num" style="color:var(--ink);font-size:20px">${r0(S.soc)}%</span><input type="range" id="soc" min="1" max="100" value="${r0(S.soc)}"></label>
    <p class="small muted">${t('Enter what your display shows. You can update it any time from the battery button at the top.')}</p>
    <div class="card sect"><h3>${t('Connect your vehicle (optional)')}</h3><p class="small">${t("Live battery data needs an official link from your vehicle's maker. Not every EV can connect yet. Manual entry gives you every feature.")}</p><button class="btn" data-act="connect">${t('Check for my {v}',{v:vword()})}</button>
    ${S.vehicleLink==='tried'?`<div class="banner info"><span class="ico">i</span><div>${t('No maker link is available for {m} yet. Continue with manual entry.',{m:esc(S.vehicle.make)})}</div></div>`:''}</div>${nav()}</div>`;
  if(s===5) return `<div class="onb">${dots}<span class="eyebrow">${t('Step {n} · Location',{n:5})}</span><h1>${t('Where are you?')}</h1>
    <div class="card sect"><h3>${t('Why MyEV asks for location')}</h3><p class="small">${t('To sort chargers by distance and estimate your arrival battery. Location is used only while the app is open. It is never shared with charger networks.')}</p>
    <button class="btn" data-act="devloc">${t('Use my current location')}</button>
    ${S.locTried?`<div class="banner info"><span class="ico">i</span><div>${t("Location isn't available in this browser. Pick a place instead.")}</div></div>`:''}</div>
    <div class="eyebrow">${t('Or choose a place')}</div>
    <div class="stack">${PLACES.slice(0,6).map(p=>`<button class="opt" data-act="setplace" data-n="${esc(p.name)}" aria-pressed="${S.loc.name===p.name}">${esc(p.name)}</button>`).join('')}</div>${nav('Start using MyEV')}</div>`;
}
function saveVehicleFields(){
  const g=id=>$('#'+id); if(!g('v_make')) return;
  const v=S.vehicle;
  v.make=g('v_make').value.trim()||v.make; v.model=g('v_model').value.trim()||v.model; v.year=+g('v_year').value||v.year;
  v.battery=+g('v_battery').value||v.battery; v.usable=Math.min(+g('v_usable').value||v.battery, v.battery); v.cons=clamp(+g("v_cons").value||v.cons,15,400);
  v.maxDC=+g('v_maxDC').value||0; v.maxAC=+g('v_maxAC').value||3.3;
  const cs=[...document.querySelectorAll('.v_conn:checked')].map(x=>x.value); v.connectors=cs.length?cs:v.connectors;
}


/* ---------- events ---------- */
function setVehicle(i){
  const yr=S.vehicle.year||2024;
  if(i>=0) S.vehicle={...VEHICLES[i], connectors:[...VEHICLES[i].connectors], year:yr, idx:i};
  else S.vehicle={type:S.vtype, make:'My', model:VTYPES[S.vtype].label, year:yr, idx:-1, ...({car:{battery:40,usable:38,maxDC:50,maxAC:7.2,cons:145,connectors:['CCS2','T2']}, '2w':{battery:3,usable:2.7,maxDC:0,maxAC:0.8,cons:30,connectors:['IEC']}, '3w':{battery:8,usable:7.3,maxDC:0,maxAC:2,cons:75,connectors:['IEC']}})[S.vtype]};
  S.stay.station=DEFAULT_STAY[S.vehicle.type]; S.compare=[]; S.selected=null;
}
function focusH1(){ const h=$('#app h1'); if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); } }
const NAVACTS=new Set(['guest','sso','confirmlang','changelang','signout','onext','oback','oskip','editvehicle']);
function go(v){ S.view=v; render(); const m=$('#main'); if(m) m.scrollTop=0; window.scrollTo(0,0); focusH1(); }
document.addEventListener('click', ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  switch(a){
    case 'tab': S.detail=null; go(d.v); break;
    case 'mode': S.mapMode=d.v; render(); break;
    case 'filter': S.filters[d.k]=!S.filters[d.k]; render(); break;
    case 'pick': S.selected=d.id; render(); break;
    case 'open': S.detail=d.id; S.selected=d.id; go('detail'); break;
    case 'compareTop': S.compare=[]; go('compare'); break;
    case 'cmpToggle': { const i=S.compare.indexOf(d.id); if(i>=0) S.compare.splice(i,1); else { if(S.compare.length>=3) S.compare.shift(); S.compare.push(d.id);} render(); break; }
    case 'refresh': {
      if(SRV.on && !S.providerDown){ loadStations(true).then(()=>{ toast(t('Charger status refreshed')); render(); }); break; }
      if(S.providerDown){ toast(t('Network feed still unavailable. Showing last known data.')); render(); break; }
      S.lastRefresh=Date.now(); S.lastGoodFeed=Date.now();
      ST.forEach(s=>{ if(s.status.src==='live' && s.id!=='s5'){ s.status.age=0; } });
      const s2=ST.find(s=>s.id==='s2'); if(s2.status.queue>0 && Math.random()<.5){ s2.status.queue--; }
      toast(t('Charger status refreshed')); render(); break; }
    case 'setplace': { const p=(S.placeResults||[]).find(x=>x.name===d.n)||PLACES.find(x=>x.name===d.n); if(!p) break; S.placeResults=[]; if(SRV.on){ S.loc={name:p.name,lat:p.lat,lng:p.lng}; S.placeQuery=''; S.selected=null; render(); loadStations().then(render); break; } S.loc={...p}; S.placeQuery=''; S.selected=null; render(); break; }
    case 'editsoc': S.view='me'; render(); setTimeout(()=>{$('#soc')?.focus();},0); break;
    case 'driving': S.driving=!S.driving; render(); break;
    case 'navigate': { const st=ST.find(s=>s.id===d.id); if(S.personal.on) S.personal.choices.push({net:st.net, station:st.name, at:Date.now()}); persist(); break; }
    case 'stayhere': S.stay.station=d.id; S.detail=null; go('switch'); break;
    case 'ahead': S.stay.ahead=clamp(S.stay.ahead+ +d.d,0,8); render(); break;
    case 'elapsed': S.stay.elapsed=clamp(S.stay.elapsed+ +d.d,0,AVG_SESSION); render(); break;
    case 'report': {
      if(SRV.on){ const labels2={ok:'Charged successfully',queue:'Reported a queue',broken:'Reported charger broken',wrong:'Reported wrong details'};
        S.reports.push({id:d.id, k:d.k, label:labels2[d.k], at:Date.now()});
        api('/api/reports',{method:'POST',body:{stationId:d.id,kind:d.k}}).then(()=>loadStations()).then(()=>{ toast(t('Thanks. Your report is shown with a timestamp.')); render(); }).catch(e=>toast(e.message)); break; }
      const labels={ok:'Charged successfully',queue:'Reported a queue',broken:'Reported charger broken',wrong:'Reported wrong details'}; /* translated at render */
      S.reports.push({id:d.id, k:d.k, label:labels[d.k], at:Date.now()});
      const st=ST.find(s=>s.id===d.id);
      if(d.k==='broken'){ st.status.broken=(st.status.broken||0)+1; st.status.free=Math.max(0,(st.status.free||0)-1); }
      if(d.k==='queue' && st.status.src!=='live'){ st.status.queue=(st.status.queue||0)+1; st.status.free=0; }
      toast(t('Thanks. Your report is shown with a timestamp.')); render(); break; }
    case 'logsession': {
      const e=estimate(ST.find(s=>s.id===d.id), ST.find(s=>s.id===d.id), S.soc);
      const sess={station:e.st.name, kwh:+e.kwhIn.toFixed(1)||10, min:r0(e.charge||30), cost:r0(e.cost||0), at:Date.now()};
      S.history.push(sess);
      if(SRV.on && S.auth?.server) api('/api/history',{method:'POST',body:sess}).catch(err=>toast(err.message));
      toast(t('Session saved to your history (estimated values, edit later)')); render(); break; }
    case 'ask': runAsk(d.q, t(d.q)); break;
    case 'prio': { const i=+d.i, j=i+ +d.d; [S.prios[i],S.prios[j]]=[S.prios[j],S.prios[i]]; render(); break; }
    case 'connect': S.vehicleLink='tried'; render(); break;
    case 'personal': S.personal.on=!S.personal.on; render(); break;
    case 'clearpersonal': S.personal.choices=[]; toast(t('Learned preferences cleared')); render(); break;
    case 'outage': S.providerDown=!S.providerDown; if(!S.providerDown){S.lastRefresh=Date.now(); S.lastGoodFeed=Date.now();} render(); break;
    case 'askdelete': S.confirmDelete=true; render(); setTimeout(()=>{ const c=$('#delconfirm'); if(c){ c.focus(); c.scrollIntoView({block:'center'}); } },0); break;
    case 'canceldelete': S.confirmDelete=false; render(); break;
    case 'delete': {
      const wipe=()=>{ try{localStorage.removeItem('myev-proto');}catch(e){} S=fresh(); unseed(); ST=JSON.parse(JSON.stringify(STATIONS)); toast(t('All your data was deleted')); render(); };
      // Only say it's deleted once the server has deleted it.
      if(SRV.on && S.auth?.server) api('/api/account',{method:'DELETE'}).then(wipe).catch(e=>{ S.confirmDelete=false; toast(t("Couldn't delete your account: {e}",{e:e.message})); render(); });
      else wipe();
      break; }
    case 'editvehicle': S.onboarded=false; S.step=1; S.vtype=S.vehicle.type||'car'; render(); window.scrollTo(0,0); break;
    case 'oskip': { const i=VEHICLES.findIndex(v=>v.type===S.vtype); setVehicle(i); S.onboarded=true; S.view='map'; render(); break; }
    case 'vtype': if(S.vtype!==d.k){ S.vtype=d.k; S.brand='All'; S.modelQuery=''; S.vehicle.idx=-2; } render(); break;
    case 'brand': S.brand=d.b; render(); break;
    case 'guest': S.needLang=true; S.langPick=S.lang; S.auth={method:'guest', label:'Guest'}; S.login={stage:'landing',email:'',err:''}; render(); break;
    case 'sso': { if(SRV.on){ if(d.p==='google' && SRV.f.googleSignIn){ location.href='/api/auth/google/start'; } else { S.login.err = d.p==='apple' ? t("Sign in with Apple isn't available right now.") : t("Google sign-in isn't available right now."); render(); } break; }
      const n=d.p==='apple'?'Apple':'Google'; S.needLang=true; S.langPick=S.lang; S.auth={method:d.p, label:`${n} account`}; S.login={stage:'landing',email:'',err:''}; render(); window.scrollTo(0,0); focusH1(); toast(t('Signed in with {n}',{n})); break; }
    case 'lgstage': { const em=$('#lg_email')?.value.trim()||S.login.email; S.login={stage:d.s, email:em, err:'', showPw:false}; render(); window.scrollTo(0,0); const h=$('.lg-hello h1'); if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); } break; }
    case 'togglepw': { const v=$('#lg_pw')?.value||''; S.login.showPw=!S.login.showPw; const em=$('#lg_email')?.value; if(em!=null) S.login.email=em; const nm=$('#lg_name')?.value; if(nm!=null) S.login.name=nm; render(); const p=$('#lg_pw'); if(p){ p.value=v; p.focus(); } break; }
    case 'picklang': S.langPick=d.c; render(); break;
    case 'confirmlang': S.lang=S.langPick||S.lang||'en'; S.needLang=false; S.langPick=null; S.chat=[]; render(); window.scrollTo(0,0); break;
    case 'changelang': S.needLang=true; S.langPick=S.lang||'en'; render(); window.scrollTo(0,0); break;
    case 'signout': if(SRV.on && S.auth?.server) api('/api/auth/logout',{method:'POST'}).catch(()=>{}); S.auth=null; S.login={stage:'landing',email:'',err:''}; S.view='map'; unseed(); render(); window.scrollTo(0,0); break;
    case 'onext': if(S.step===2 && S.vehicle.idx===-2) break; saveVehicleFields(); if(S.step>=OSTEPS){ S.onboarded=true; S.view='map'; } else S.step++; render(); window.scrollTo(0,0); break;
    case 'oback': saveVehicleFields(); S.step=Math.max(1,S.step-1); render(); break;
    case 'pickveh': setVehicle(+d.i); render(); break;
    case 'devloc': S.locTried=true; render(); break;
  }
  if(NAVACTS.has(a)) focusH1();
});

});
document.addEventListener('submit', ev=>{
  const lgFail=(msg,focus)=>{ const pwv=$('#lg_pw')?.value||''; S.login.email=$('#lg_email')?.value.trim()||''; const nm=$('#lg_name')?.value; if(nm!=null) S.login.name=nm; S.login.err=msg; render(); const p=$('#lg_pw'); if(p) p.value=pwv; $(focus)?.focus(); };
  const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
  if(ev.target.id==='signinform'||ev.target.id==='signupform'){ ev.preventDefault();
    const em=$('#lg_email').value.trim(), pw=$('#lg_pw').value, up=ev.target.id==='signupform';
    if(up && !$('#lg_name').value.trim()) return lgFail(t('Enter your name.'),'#lg_name');
    if(!emailOk(em)) return lgFail(t('Enter a valid email address, like you@example.com.'),'#lg_email');
    if(!pw) return lgFail(t('Enter your password.'),'#lg_pw');
    if(up && pw.length<8) return lgFail(t('Use at least 8 characters for your password.'),'#lg_pw');
    if(SRV.on){ const btn=ev.target.querySelector('.lg-primary'); if(btn) btn.disabled=true;
      api(up?'/api/auth/signup':'/api/auth/login',{method:'POST',body:{name:$('#lg_name')?.value.trim(),email:em,password:pw}})
        .then(r=>onSignedIn(r.user,'email',true)).then(()=>loadStations()).then(()=>{ render(); window.scrollTo(0,0); focusH1(); })
        .catch(e=>{ if(btn) btn.disabled=false; lgFail(e.message, e.status===401?'#lg_pw':'#lg_email'); });
      return; }
    S.needLang=true; S.langPick=S.lang; S.auth={method:'email', label:maskEmail(em)}; S.login={stage:'landing',email:'',err:''};
    if(up){ S.onboarded=false; S.step=1; }
    render(); window.scrollTo(0,0); focusH1(); toast(up?t('Account created'):t('Signed in')); return; }
  if(ev.target.id==='forgotform'){ ev.preventDefault(); const em=$('#lg_email').value.trim();
    if(!emailOk(em)) return lgFail(t('Enter the email address you signed up with.'),'#lg_email');
    if(SRV.on){ api('/api/auth/forgot',{method:'POST',body:{email:em}}).then(r=>{ S.login={stage:'forgot', email:em, err:'', sent:true, noEmail:!r.emailConfigured}; render(); }).catch(e=>lgFail(e.message,'#lg_email')); return; }
    S.login={stage:'forgot', email:em, err:'', sent:true}; render(); return; } if(ev.target.id==='askform'){ ev.preventDefault(); const q=$('#askq').value.trim(); if(q) runAsk(q); } });
function runAsk(q, label){
  if(SRV.on && ['claude','nvidia'].includes(SRV.f.assistant)) return askServer(q, label);
  S.chat.push({who:'me', html:esc(label||q)});
  S.chat.push({who:'bot', html:answer(q)});
  render(); const m=$('#main'); if(m) m.scrollTop=m.scrollHeight; window.scrollTo(0,document.body.scrollHeight); $('#askq')?.focus({preventScroll:true});
}

/* ===================== SERVER BRIDGE =====================
   When this page is served by the MyEV server, it uses the real API (accounts, live listings, AI chatbot).
   Opened on its own (file or artifact), it stays in demo mode. */
const SRV = { on:false, f:{} };
S.routes = S.routes || {}; S.placeResults = []; S.chatLog = [];
async function api(path, opts={}){
  const r = await fetch(path, { method: opts.method||'GET', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: opts.body!=null?JSON.stringify(opts.body):undefined });
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok){ const e=new Error(d.error||`Request failed (${r.status})`); e.status=r.status; throw e; }
  return d;
}
const PROFILE_KEYS=['vehicle','vtype','soc','socTime','loc','prios','reserve','target','lang','onboarded','personal'];
let syncTimer=null, lastSynced='';
function syncProfile(){
  if(!SRV.on || !S.auth?.server) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{ const body={}; PROFILE_KEYS.forEach(k=>body[k]=S[k]); const sig=JSON.stringify(body); if(sig===lastSynced) return; lastSynced=sig; api('/api/profile',{method:'PUT',body}).catch(e=>{ if(e.status===401){ S.auth=null; render(); } }); }, 800);
}
async function onSignedIn(user, method, fresh){
  S.auth={method, label:user.email, name:user.name, server:true};
  lastSynced=''; unseed();
  try{ const p=await api('/api/profile'); if(p.profile){ PROFILE_KEYS.forEach(k=>{ if(p.profile[k]!=null) S[k]=p.profile[k]; }); } else { S.onboarded=false; S.step=1; } }catch(e){}
  try{ const h=await api('/api/history'); S.history=h.history; }catch(e){ S.history=[]; }
  S.chat=[]; S.chatLog=[];
  if(fresh){ S.needLang=true; S.langPick=S.lang; }
}
async function loadStations(force){
  if(!SRV.on || !S.loc) return;
  try{
    const r=await api(`/api/stations?lat=${S.loc.lat}&lng=${S.loc.lng}&radius=15`);
    ST=r.stations; S.stationSource=r.source; S.lastRefresh=Date.now(); S.lastGoodFeed=Date.now();
    if(r.error) toast(r.error);
  }catch(e){ toast(t("Couldn't load chargers. Showing the last list.")); }
  try{ const w=await api(`/api/weather?lat=${S.loc.lat}&lng=${S.loc.lng}`); TEMP_C=w.tempC; }catch(e){}
}
const routeKey = st => `${st.id}@${S.loc.lat.toFixed(4)},${S.loc.lng.toFixed(4)}`;
function requestRoute(st){
  if(!SRV.on || SRV.f.routing!=='google') return;
  const k=routeKey(st); if(S.routes[k]) return;
  S.routes[k]={pending:true};
  api(`/api/route?from_lat=${S.loc.lat}&from_lng=${S.loc.lng}&to_lat=${st.lat}&to_lng=${st.lng}`).then(r=>{ S.routes[k]=r; if(S.view==='detail') render(); }).catch(()=>{});
}
let placeTimer=null;
function searchPlaces(q){
  clearTimeout(placeTimer);
  if(!q.trim()){ S.placeResults=[]; return; }
  placeTimer=setTimeout(async()=>{
    try{ const r=await api(`/api/places?q=${encodeURIComponent(q)}&lat=${S.loc.lat}&lng=${S.loc.lng}`); S.placeResults=r.places||[]; S.placeDone=q.trim();
      if(S.placeQuery.trim()===q.trim()){ const i=$('#placeq'), pos=i?.selectionStart; render(); const j=$('#placeq'); if(j){ j.focus(); j.setSelectionRange(pos,pos);} } }catch(e){ S.placeDone=q.trim(); }
  }, 250);
}
function mdLite(txt){
  return esc(txt).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
}
async function askServer(q, label){
  S.chat.push({who:'me', html:esc(label||q)});
  S.chatLog.push({role:'user', content:label||q});
  const pending={who:'bot', html:`<span class="muted">${t('Thinking…')}</span>`}; S.chat.push(pending);
  render(); const m=$('#main'); if(m) m.scrollTop=m.scrollHeight; window.scrollTo(0,document.body.scrollHeight); $('#askq')?.focus({preventScroll:true});
  const context={vehicle:S.vehicle, soc:S.soc, socMinutesAgo:(Date.now()-S.socTime)/60e3, loc:S.loc, reserve:S.reserve, target:S.target, prios:S.prios, lang:S.lang||'en', stayStation:S.stay.station};
  try{
    const r=await api('/api/chat',{method:'POST', body:{messages:S.chatLog, context}});
    S.chatLog.push({role:'assistant', content:r.reply});
    const minis=(r.stations||[]).map(id=>ST.find(s=>s.id===id)).filter(Boolean).slice(0,4).map(st=>{ const e=estimate(st); return `<button class="mini" data-act="open" data-id="${st.id}"><b>${esc(st.name)}</b><span class="small num">${e.km.toFixed(1)} km · ${e.plug?e.plug.kw+' kW':'—'} · ${esc(e.av.text)} ${srcTag(e.av)}</span></button>`; }).join('');
    const links=(r.openSwitch?`<button class="btn primary" data-act="tab" data-v="switch">${t('Stay or switch')}</button>`:'')+(r.openTrip?`<button class="btn primary" data-act="tab" data-v="trip">${t('Trip planner')}</button>`:'');
    if(r.openSwitch) S.stay.station=r.openSwitch; if(r.openTrip) S.trip.route=r.openTrip;
    pending.html = `<div>${mdLite(r.reply)}</div>` + minis + links;
  }catch(e){
    S.chatLog.pop();
    pending.html = `<span style="color:var(--bad)">${esc(t("The assistant couldn't answer: {e}",{e:e.message}))}</span>`;
  }
  render(); const m2=$('#main'); if(m2) m2.scrollTop=m2.scrollHeight; window.scrollTo(0,document.body.scrollHeight); $('#askq')?.focus({preventScroll:true});
}
async function boot(){
  try{ const c=await api('/api/config'); if(!c.server) return; SRV.on=true; SRV.f=c.features||{}; }catch(e){ return; }
  if(!S.auth) unseed();
  const qs=new URLSearchParams(location.search);
  if(qs.get('signin_error')){ S.login.err=qs.get('signin_error'); S.login.stage='signin'; }
  if(qs.has('signin')||qs.has('signin_error')) history.replaceState(null,'',location.pathname);
  try{
    const me=await api('/api/auth/me');
    if(me.user) await onSignedIn(me.user, qs.get('signin')==='google'?'google':'email', qs.get('signin')==='google');
    else if(S.auth && S.auth.server) S.auth=null;          // session ended on the server
  }catch(e){}
  await loadStations();
  render();
}

setInterval(()=>{ if(S.onboarded && ['map','detail'].includes(S.view) && !document.activeElement?.matches('input,select')) render(); }, 60e3);
render();
boot();
/* Splash: logo shows on open, then hands off to the landing page (or the app if already signed in). Tap or press Enter/Space/Escape to skip. */
(function(){
  const sp=$('#splash'); if(!sp) return;
  const done=()=>{ if(sp.hidden||sp.classList.contains('out')) return; sp.classList.add('out'); setTimeout(()=>{ sp.hidden=true; const h=$('#app h1'); if(h){ h.tabIndex=-1; h.focus({preventScroll:true}); } },350); };
  sp.addEventListener('click', done);
  sp.addEventListener('keydown', e=>{ if(['Enter',' ','Escape'].includes(e.key)){ e.preventDefault(); done(); } });
  sp.focus({preventScroll:true});
  setTimeout(done, 1800);
})();
</script>
</body></html>
